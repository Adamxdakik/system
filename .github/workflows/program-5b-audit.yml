name: Program 5B Static Audit

on:
  pull_request:

permissions:
  contents: write

jobs:
  audit:
    if: github.event.pull_request.head.ref == 'agent/program-5-bandwidth-verification'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out Program 5 branch
        uses: actions/checkout@v4
        with:
          ref: agent/program-5-bandwidth-verification
          fetch-depth: 0

      - name: Generate route and client traffic audit
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          from collections import Counter, defaultdict

          root = Path('.')
          route_files = list((root / 'server').rglob('*.ts'))
          client_files = list((root / 'client' / 'src').rglob('*.ts')) + list((root / 'client' / 'src').rglob('*.tsx'))

          route_pattern = re.compile(r'app\.(get|post|put|patch|delete)\(\s*["\']([^"\']+)["\']', re.M)
          candidates = []
          all_routes = []

          for path in route_files:
              text = path.read_text(encoding='utf-8', errors='ignore')
              matches = list(route_pattern.finditer(text))
              line_starts = [0]
              for match in re.finditer(r'\n', text):
                  line_starts.append(match.end())
              def line_number(offset):
                  import bisect
                  return bisect.bisect_right(line_starts, offset)
              for index, match in enumerate(matches):
                  start = match.start()
                  end = matches[index + 1].start() if index + 1 < len(matches) else min(len(text), start + 12000)
                  block = text[start:end]
                  method, route = match.group(1).upper(), match.group(2)
                  metrics = {
                      'awaits': len(re.findall(r'\bawait\b', block)),
                      'selects': len(re.findall(r'\.select\s*\(', block)),
                      'db_executes': len(re.findall(r'\bdb\.execute\s*\(', block)),
                      'joins': len(re.findall(r'\.(?:leftJoin|innerJoin|rightJoin|fullJoin)\s*\(', block)),
                      'limits': len(re.findall(r'\.limit\s*\(', block)),
                      'orders': len(re.findall(r'\.orderBy\s*\(', block)),
                      'jsons': len(re.findall(r'\bres\.(?:json|send)\s*\(', block)),
                      'loops': len(re.findall(r'\b(?:for|while)\s*\(', block)),
                      'promises': len(re.findall(r'Promise\.all\s*\(', block)),
                      'block_lines': block.count('\n') + 1,
                  }
                  risk = metrics['selects'] * 3 + metrics['db_executes'] * 3 + metrics['joins'] * 2 + metrics['awaits'] + metrics['loops'] * 2
                  if metrics['limits'] == 0 and (metrics['selects'] + metrics['db_executes']) > 0:
                      risk += 8
                  if metrics['block_lines'] > 180:
                      risk += 5
                  all_routes.append((method, route, str(path), line_number(start), metrics, risk))
                  if method == 'GET' and risk >= 8:
                      candidates.append((risk, method, route, str(path), line_number(start), metrics))

          endpoint_usage = Counter()
          endpoint_files = defaultdict(set)
          refetch_usage = []
          interval_usage = []
          api_pattern = re.compile(r'["\'`](/api/[^"\'`?${}\s]+)')
          for path in client_files:
              text = path.read_text(encoding='utf-8', errors='ignore')
              for match in api_pattern.finditer(text):
                  endpoint = re.sub(r'/\d+(?=/|$)', '/:id', match.group(1))
                  endpoint_usage[endpoint] += 1
                  endpoint_files[endpoint].add(str(path))
              for line_no, line in enumerate(text.splitlines(), 1):
                  if 'refetchInterval' in line:
                      refetch_usage.append((str(path), line_no, line.strip()))
                  if 'setInterval(' in line:
                      interval_usage.append((str(path), line_no, line.strip()))

          output = []
          output.append('# Program 5B Static Heavy-API Audit')
          output.append('')
          output.append('Generated from the exact Program 5 branch. This is code-level evidence only; production telemetry remains the source of truth after deployment.')
          output.append('')
          output.append('## Highest-risk GET handlers')
          output.append('')
          output.append('| Risk | Route | Source | Select/execute | Joins | Await | Loops | Limit | Lines |')
          output.append('|---:|---|---|---:|---:|---:|---:|---:|---:|')
          for risk, method, route, path, line, m in sorted(candidates, reverse=True)[:60]:
              output.append(f"| {risk} | `{method} {route}` | `{path}:{line}` | {m['selects'] + m['db_executes']} | {m['joins']} | {m['awaits']} | {m['loops']} | {m['limits']} | {m['block_lines']} |")

          output.append('')
          output.append('## Client endpoint reference counts')
          output.append('')
          output.append('| References | Endpoint | Files |')
          output.append('|---:|---|---:|')
          for endpoint, count in endpoint_usage.most_common(60):
              output.append(f"| {count} | `{endpoint}` | {len(endpoint_files[endpoint])} |")

          output.append('')
          output.append('## Client automatic refetch configuration')
          output.append('')
          if refetch_usage:
              for path, line, content in refetch_usage:
                  output.append(f"- `{path}:{line}` — `{content}`")
          else:
              output.append('- No `refetchInterval` declarations found.')

          output.append('')
          output.append('## Client timer calls')
          output.append('')
          if interval_usage:
              for path, line, content in interval_usage:
                  output.append(f"- `{path}:{line}` — `{content}`")
          else:
              output.append('- No `setInterval` calls found.')

          output.append('')
          output.append('## Audit scope')
          output.append('')
          output.append(f"- Server TypeScript files scanned: {len(route_files)}")
          output.append(f"- Express routes detected: {len(all_routes)}")
          output.append(f"- Client TypeScript files scanned: {len(client_files)}")
          output.append(f"- Unique client API references detected: {len(endpoint_usage)}")

          Path('docs/program-5b-static-audit.md').write_text('\n'.join(output) + '\n', encoding='utf-8')
          PY

      - name: Commit audit report
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/program-5b-static-audit.md
          git commit -m "Record Program 5B static heavy API audit"
          git push origin HEAD:agent/program-5-bandwidth-verification
