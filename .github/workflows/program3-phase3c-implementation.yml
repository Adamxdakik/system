          source = replace_once(
              source,
              '  const [otherCharges, setOtherCharges] = useState("0");\n',
              '  const [otherCharges, setOtherCharges] = useState("0");\n  const [advancedOpen, setAdvancedOpen] = useState(false);\n  const [chargesOpen, setChargesOpen] = useState(false);\n',
              "PO states",
