                  {!saveMutation.isPending && <Check className="h-4 w-4" />}
                </Button>
              </div>
            </div>
          </div>
'''
          source = replace_once(source, old_summary, new_summary, "POS summary")
          source = replace_once(
              source,
              '''            <p className="text-xs font-semibold uppercase tracking-wide text-muted-foreground mb-2">
