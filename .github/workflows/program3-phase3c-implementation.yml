name: Program 3 Phase 3C Implementation

on:
  pull_request:

permissions:
  contents: read

jobs:
  implement:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --include=dev
      - name: Apply Phase 3C interface changes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(source: str, old: str, new: str, label: str) -> str:
              if source.count(old) != 1:
                  raise RuntimeError(f"{label}: expected one match, found {source.count(old)}")
              return source.replace(old, new, 1)

          # POS sale workflow
          path = Path("client/src/pages/POS.tsx")
          source = path.read_text()
          source = replace_once(
              source,
              'import { Card } from "@/components/ui/card";\n',
              'import { Card } from "@/components/ui/card";\nimport { Badge } from "@/components/ui/badge";\n',
              "POS badge import",
          )
          source = replace_once(
              source,
              '  const [showDraftDialog, setShowDraftDialog] = useState(false);\n',
              '  const [showDraftDialog, setShowDraftDialog] = useState(false);\n  const [moreOptionsOpen, setMoreOptionsOpen] = useState(false);\n',
              "POS options state",
          )
          source = replace_once(
              source,
              '''  const total = rows.reduce((sum, row) => sum + (row.amount || 0), 0);
  const totalQty = rows.reduce((sum, row) => sum + (parseFloat(String(row.quantity)) || 0), 0);
  const filteredItems = getFilteredInventory();
''',
              '''  const total = rows.reduce((sum, row) => sum + (row.amount || 0), 0);
  const totalQty = rows.reduce((sum, row) => sum + (parseFloat(String(row.quantity)) || 0), 0);
  const validSaleItemCount = rows.filter(
    (row) => row.stockItemId && row.quantity > 0 && row.rate > 0,
  ).length;
  const hasPaymentSelection = isCreditSale ? Boolean(selectedCustomerId) : Boolean(paymentAccountId);
  const saleReady = Boolean(activeLocation) && hasPaymentSelection && validSaleItemCount > 0;
  const saleGuidance = !activeLocation
    ? "Select a sale location to continue."
    : !hasPaymentSelection
      ? isCreditSale
        ? "Select a customer account for this credit sale."
        : "Select the cash account receiving this payment."
      : validSaleItemCount === 0
        ? "Add at least one product with a quantity and price."
        : editVoucherId
          ? "Review the totals, then update the sale."
          : "The sale is ready to complete and print.";
  const filteredItems = getFilteredInventory();
''',
              "POS readiness",
          )
          source = replace_once(
              source,
              '''      {/* Page heading — only when not embedded */}
      {!embedded && (
        <div>
          <h1 className="text-2xl font-semibold">New Sale</h1>
          <p className="text-sm text-muted-foreground">
            Sell motorcycles, spare parts and workshop items.
          </p>
        </div>
      )}

''',
              '''      {!posUser && (
        <div className="flex flex-col gap-2 sm:flex-row sm:items-start sm:justify-between">
          <div>
            <h1 className="text-2xl font-semibold">
              {editVoucherId ? "Edit Sale" : "New Sale"}
            </h1>
            <p className="text-sm text-muted-foreground">
              Add products, confirm payment details, and review the total before saving.
            </p>
          </div>
          {editVoucherId && <Badge variant="secondary">Editing existing sale</Badge>}
        </div>
      )}

''',
              "POS heading",
          )
          source = replace_once(
              source,
              '''      <Card className="p-4 space-y-4">
        <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
''',
              '''      <Card className="space-y-4 p-4">
        <div>
          <h2 className="text-base font-semibold">Sale setup</h2>
          <p className="text-sm text-muted-foreground">
            Choose where the sale is posted and how the customer is paying.
          </p>
        </div>
        <div className="grid grid-cols-1 gap-4 md:grid-cols-3">
''',
              "POS setup card",
          )
          source = replace_once(
              source,
              '''        <Collapsible>
          <CollapsibleTrigger asChild>
            <Button
              variant="ghost"
              size="sm"
              className="gap-1.5 text-muted-foreground -ml-2"
              data-testid="button-more-options"
            >
              <ChevronDown className="h-4 w-4" />
              More Options
            </Button>
          </CollapsibleTrigger>
''',
              '''        <Collapsible open={moreOptionsOpen} onOpenChange={setMoreOptionsOpen}>
          <CollapsibleTrigger asChild>
            <Button
              variant="ghost"
              size="sm"
              className="-ml-2 gap-1.5 text-muted-foreground"
              data-testid="button-more-options"
            >
              <ChevronDown
                className={`h-4 w-4 transition-transform ${moreOptionsOpen ? "rotate-180" : ""}`}
              />
              Sale details and drafts
            </Button>
          </CollapsibleTrigger>
''',
              "POS collapsible",
          )
          source = replace_once(
              source,
              '<div className="min-w-full">\n',
              '<div className="min-w-[720px]">\n',
              "POS table width",
          )
          old_summary = '''          {/* Order summary + actions */}
          <div className="border-t bg-muted/10 p-4">
            <div className="flex flex-col sm:flex-row items-start sm:items-end justify-between gap-4">
              <div className="flex gap-8 text-sm">
                <div>
                  <p className="text-muted-foreground text-xs">Products</p>
                  <p className="font-mono font-semibold">{rows.filter((r) => r.amount > 0).length}</p>
                </div>
                <div>
                  <p className="text-muted-foreground text-xs">Total Quantity</p>
                  <p className="font-mono font-semibold" data-testid="text-total-qty">
                    {totalQty > 0 ? totalQty.toFixed(2) : "0"}
                  </p>
                </div>
                <div>
                  <p className="text-muted-foreground text-xs">Grand Total</p>
                  <p className="font-mono font-bold text-2xl" data-testid="text-grand-total">
                    ${total.toFixed(2)}
                  </p>
                </div>
              </div>

              <div className="flex gap-2 shrink-0">
                <Button
                  variant="outline"
                  onClick={() => saveDraftMutation.mutate()}
                  disabled={
                    saveDraftMutation.isPending ||
                    rows.filter((r) => r.stockItemId && r.quantity > 0).length === 0
                  }
                  data-testid="button-save-draft"
                >
                  {saveDraftMutation.isPending
                    ? "Saving..."
                    : currentDraftId
                    ? "Update Draft"
                    : "Save Draft"}
                </Button>
                <Button
                  onClick={handleSaveSale}
                  disabled={saveMutation.isPending}
                  className="gap-2"
                  data-testid="button-complete-sale"
                >
                  {saveMutation.isPending
                    ? editVoucherId ? "Updating..." : "Saving..."
                    : editVoucherId ? "Update Sale" : "Complete Sale & Print"}
                  {!saveMutation.isPending && <Check className="h-4 w-4" />}
                </Button>
              </div>
            </div>
          </div>
'''
          new_summary = '''          {/* Order summary + actions */}
          <div className="border-t bg-muted/10 p-4">
            <div className="grid gap-4 lg:grid-cols-[minmax(0,1fr)_auto] lg:items-end">
