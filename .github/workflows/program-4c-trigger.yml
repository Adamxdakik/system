name: Program 4C trigger

# second push activates this temporary workflow
on:
  push:
    branches:
      - agent/program-4-motorcycle-records
    paths:
      - .github/workflows/program-4c-trigger.yml

permissions:
  contents: write

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/program-4-motorcycle-records
          fetch-depth: 0
      - name: Trigger integration workflow
        shell: bash
        run: |
          printf '\n# integration trigger\n' >> .github/workflows/program-4c-integrate.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/program-4c-integrate.yml
          git commit -m "Trigger Program 4C integration"
          git push origin HEAD:agent/program-4-motorcycle-records
