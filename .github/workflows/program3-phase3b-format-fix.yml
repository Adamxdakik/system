name: Program 3 Phase 3B Format Fix

on:
  pull_request:

permissions:
  contents: read

jobs:
  fix:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --include=dev
      - name: Format Phase 3B files
        run: |
          npx prettier --write \
            client/src/pages/StockItems.tsx \
            client/src/components/StockItemCreateDialog.tsx \
            client/src/components/StockItemEditDialog.tsx
          rm .github/workflows/program3-phase3b-format-fix.yml
      - name: Commit formatting
        shell: bash
        run: |
          if git diff --quiet -- \
            client/src/pages/StockItems.tsx \
            client/src/components/StockItemCreateDialog.tsx \
            client/src/components/StockItemEditDialog.tsx \
            .github/workflows/program3-phase3b-format-fix.yml; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            client/src/pages/StockItems.tsx \
            client/src/components/StockItemCreateDialog.tsx \
            client/src/components/StockItemEditDialog.tsx \
            .github/workflows/program3-phase3b-format-fix.yml
          git commit -m "style(program-3): format phase 3B files"
          git pull --rebase origin "${{ github.event.pull_request.head.ref }}"
          git push origin HEAD:"${{ github.event.pull_request.head.ref }}"
