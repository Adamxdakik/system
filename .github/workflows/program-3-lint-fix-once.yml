name: Program 3 lint fix once

on:
  push:
    branches:
      - agent/program-3-simplified-interface-rebased

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --include=dev
      - name: Remove unused import
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("client/src/pages/StockItems.tsx")
          text = path.read_text()
          old = 'import { Card, CardContent, CardHeader } from "@/components/ui/card";'
          new = 'import { Card, CardContent } from "@/components/ui/card";'
          if old not in text:
              raise SystemExit("Expected CardHeader import not found")
          path.write_text(text.replace(old, new, 1))
          PY
          npx prettier --write client/src/pages/StockItems.tsx
      - name: Commit fix and remove temporary files
        run: |
          rm .github/workflows/program-3-lint-fix-once.yml
          rm docs/program-3-lint-diagnostic.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Remove unused Program 3 stock import"
          git push origin HEAD:agent/program-3-simplified-interface-rebased
