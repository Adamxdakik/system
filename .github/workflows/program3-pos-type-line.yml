name: Program 3 Phase 3C Final Cleanup

on:
  pull_request:

permissions:
  contents: read

jobs:
  finalize:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci --include=dev

      - name: Restore inventory loading state
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("client/src/pages/POS.tsx")
          source = path.read_text()
          old = '  const { data: apiInventory = [], error: inventoryError } = useQuery<APIInventoryItem[]>({\n'
          new = '''  const {
            data: apiInventory = [],
            isLoading: inventoryLoading,
            error: inventoryError,
          } = useQuery<APIInventoryItem[]>({
          '''
          if source.count(old) != 1:
              raise RuntimeError(f"Expected one inventory query match, found {source.count(old)}")
          path.write_text(source.replace(old, new, 1))
          PY
          npx prettier --write client/src/pages/POS.tsx

      - name: Verify Phase 3C source
        run: |
          npx eslint \
            client/src/pages/POS.tsx \
            client/src/pages/PurchaseOrderEdit.tsx \
            client/src/pages/AddContainer.tsx \
            --max-warnings=0
          npm run check:all:baseline

      - name: Remove diagnostics and commit final source
        shell: bash
        run: |
          rm -f \
            .github/workflows/program3-pos-type-line.yml \
            docs/program3-phase3c-exact-type.txt \
            docs/program3-phase3c-type-diagnostic.txt \
            docs/program3-phase3c-types.txt \
            docs/program3-pos-type-line.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(program-3): finalize phase 3C validation"
          git pull --rebase origin "${{ github.event.pull_request.head.ref }}"
          git push origin HEAD:"${{ github.event.pull_request.head.ref }}"
