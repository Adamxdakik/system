name: Program 4B UI patch

on:
  push:
    branches:
      - agent/program-4-motorcycle-records
    paths:
      - .github/workflows/program-4b-ui-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/program-4-motorcycle-records
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci --include=dev --silent

      - name: Add finalized sale action to registry
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("client/src/pages/Motorcycles.tsx")
          text = path.read_text()

          replacements = [
              (
                  'import { Bike, Pencil, Plus, RefreshCw, Search, Trash2 } from "lucide-react";\n',
                  'import { Bike, Link2, Pencil, Plus, RefreshCw, Search, Trash2 } from "lucide-react";\n'
                  'import { MotorcycleSaleLinkDialog } from "@/components/MotorcycleSaleLinkDialog";\n',
              ),
              (
                  '  const [editingId, setEditingId] = useState<number | null>(null);\n'
                  '  const [form, setForm] = useState<MotorcycleFormState>(blankForm);\n',
                  '  const [editingId, setEditingId] = useState<number | null>(null);\n'
                  '  const [saleLinkRecord, setSaleLinkRecord] = useState<MotorcycleRecord | null>(null);\n'
                  '  const [form, setForm] = useState<MotorcycleFormState>(blankForm);\n',
              ),
              (
                  '                        <div className="flex justify-end gap-1">\n'
                  '                          <Button\n'
                  '                            variant="ghost"\n'
                  '                            size="icon"\n'
                  '                            onClick={() => openEdit(record)}\n',
                  '                        <div className="flex justify-end gap-1">\n'
                  '                          {(record.status === "IN_STOCK" || record.status === "RESERVED") && (\n'
                  '                            <Button\n'
                  '                              variant="ghost"\n'
                  '                              size="icon"\n'
                  '                              onClick={() => setSaleLinkRecord(record)}\n'
                  '                              aria-label="Link finalized sale"\n'
                  '                              data-testid={`button-link-motorcycle-sale-${record.id}`}\n'
                  '                            >\n'
                  '                              <Link2 className="h-4 w-4" />\n'
                  '                            </Button>\n'
                  '                          )}\n'
                  '                          <Button\n'
                  '                            variant="ghost"\n'
                  '                            size="icon"\n'
                  '                            onClick={() => openEdit(record)}\n',
              ),
              (
                  '      </Dialog>\n'
                  '    </div>\n',
                  '      </Dialog>\n\n'
                  '      <MotorcycleSaleLinkDialog\n'
                  '        motorcycle={saleLinkRecord}\n'
                  '        open={Boolean(saleLinkRecord)}\n'
                  '        onOpenChange={(open) => {\n'
                  '          if (!open) setSaleLinkRecord(null);\n'
                  '        }}\n'
                  '        onLinked={() => {\n'
                  '          setSaleLinkRecord(null);\n'
                  '          refetch();\n'
                  '        }}\n'
                  '      />\n'
                  '    </div>\n',
              ),
          ]

          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f"Expected Motorcycles.tsx block not found:\n{old}")
              text = text.replace(old, new, 1)

          path.write_text(text)
          PY

          npx prettier --write \
            client/src/pages/Motorcycles.tsx \
            client/src/components/MotorcycleSaleLinkDialog.tsx \
            server/routes/motorcycleSaleRoutes.ts \
            server/index.ts \
            migrations/0030_motorcycle_sale_links.sql

      - name: Commit Program 4B UI
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add client/src/pages/Motorcycles.tsx client/src/components/MotorcycleSaleLinkDialog.tsx server/routes/motorcycleSaleRoutes.ts server/index.ts migrations/0030_motorcycle_sale_links.sql
          git commit -m "Program 4B link finalized motorcycle sales"
          git push origin HEAD:agent/program-4-motorcycle-records
