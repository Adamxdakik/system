name: Program 5 Lint Diagnostic

on:
  push:
    branches:
      - agent/program-5-bandwidth-verification

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out Program 5 branch
        uses: actions/checkout@v4
        with:
          ref: agent/program-5-bandwidth-verification
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install exact dependencies
        run: npm ci --include=dev

      - name: Capture changed-line lint errors
        shell: bash
        run: |
          set +e
          CHANGED_FILES_BASE=35c0285b2d0a41cd56d740c91cb2a5a35a3fb112 \
          CHANGED_FILES_HEAD=$(git rev-parse HEAD) \
          npm run lint:changed > /tmp/program-5-lint.log 2>&1
          status=$?
          set -e
          if [[ $status -ne 0 ]]; then
            tail -200 /tmp/program-5-lint.log > docs/program-5-lint-errors.txt
          fi
          rm .github/workflows/program-5-lint-diagnostic.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A .github/workflows/program-5-lint-diagnostic.yml docs/program-5-lint-errors.txt 2>/dev/null || true
          if git diff --cached --quiet; then
            exit $status
          fi
          git commit -m "Record Program 5 lint diagnostics"
          git push origin HEAD:agent/program-5-bandwidth-verification
          exit $status
