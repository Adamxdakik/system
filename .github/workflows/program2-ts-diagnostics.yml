name: Program 2 TypeScript Diagnostics

on:
  pull_request:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --include=dev
      - name: Capture TypeScript baseline output
        shell: bash
        run: |
          set +e
          npm run check:all:baseline > program2-ts-baseline.log 2>&1
          echo $? > program2-ts-baseline.exit
          set -e
          cat program2-ts-baseline.log
      - uses: actions/upload-artifact@v4
        with:
          name: program2-ts-baseline
          path: |
            program2-ts-baseline.log
            program2-ts-baseline.exit
          retention-days: 1
