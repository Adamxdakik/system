name: Program 2 TypeScript Diagnostics

on:
  pull_request:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --include=dev
      - name: Capture detailed TypeScript output
        shell: bash
        run: |
          set +e
          npm run check:all > program2-typescript.log 2>&1
          echo $? > program2-typescript.exit
          set -e
          cat program2-typescript.log
      - uses: actions/upload-artifact@v4
        with:
          name: program2-typescript-detailed
          path: |
            program2-typescript.log
            program2-typescript.exit
          retention-days: 1
