name: Program 5B Isolated Fix

on:
  push:
    branches:
      - agent/program-5-bandwidth-verification

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out Program 5 branch
        uses: actions/checkout@v4
        with:
          ref: agent/program-5-bandwidth-verification
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install exact dependencies
        run: npm ci --include=dev

      - name: Apply isolated Program 5B fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          accounts_path = Path('server/routes/optimizedAccountsRoutes.ts')
          accounts = accounts_path.read_text(encoding='utf-8')
          old_import = '''import {
            bankAccounts,
            fixedAssets,
            ledgerAccounts,
            suppliers,
            voucherEntries,
            vouchers,
          } from "@shared/schema";'''
          new_import = '''import { voucherEntries, vouchers } from "@shared/schema";'''
          if old_import not in accounts:
              raise SystemExit('optimized accounts import target not found')
          accounts_path.write_text(accounts.replace(old_import, new_import), encoding='utf-8')

          stock_path = Path('server/routes/optimizedStockHistoryRoutes.ts')
          stock = stock_path.read_text(encoding='utf-8')

          interface_start = stock.index('interface LocationMovementRow {')
          interface_end = stock.index('\n}\n\n', interface_start) + 4
          stock = stock[:interface_start] + stock[interface_end:]

          helper_start = stock.index('function locationMovement(')
          helper_end = stock.index('\n}\n\n', helper_start) + 4
          stock = stock[:helper_start] + stock[helper_end:]

          query_start = stock.index('  const [\n    priorTransferResult,')
          query_end_marker = '  const currentInventory = currentInventoryResult[0];'
          query_end = stock.index(query_end_marker, query_start) + len(query_end_marker)
          replacement = '''  const currentInventoryResult = await db
            .select({
              quantity: inventory.quantity,
              averageRate: inventory.averageRate,
              totalValue: inventory.totalValue,
            })
            .from(inventory)
            .where(
              and(eq(inventory.locationId, locationId), eq(inventory.stockItemId, stockItemId)),
            )
            .limit(1);
          const currentInventory = currentInventoryResult[0];'''
          stock = stock[:query_start] + replacement + stock[query_end:]

          reconciliation = '    _reconciliation: { voucherOpeningQty, voucherOpeningValue },\n'
          if reconciliation not in stock:
              raise SystemExit('reconciliation field target not found')
          stock = stock.replace(reconciliation, '')

          old_handler = '''        const result = (await coalesce(key, () =>
          loadLocationStockHistory(companyId, locationId, stockItemId, year, month),
        )) as any;
        delete result._reconciliation;
        return res.json(result);'''
          new_handler = '''        return res.json(
          await coalesce(key, () =>
            loadLocationStockHistory(companyId, locationId, stockItemId, year, month),
          ),
        );'''
          if old_handler not in stock:
              raise SystemExit('location response target not found')
          stock_path.write_text(stock.replace(old_handler, new_handler), encoding='utf-8')
          PY

          rm -f docs/program-5-lint-errors.txt
          rm .github/workflows/program-5b-fix.yml

      - name: Format only Program 5B files
        run: >-
          npx prettier --write
          server/routes/optimizedAccountsRoutes.ts
          server/routes/optimizedStockHistoryRoutes.ts

      - name: Commit isolated fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A .github/workflows/program-5b-fix.yml docs/program-5-lint-errors.txt server/routes/optimizedAccountsRoutes.ts server/routes/optimizedStockHistoryRoutes.ts
          git commit -m "Fix Program 5B lint and remove dead query wave"
          git push origin HEAD:agent/program-5-bandwidth-verification
