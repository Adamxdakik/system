name: Program 4C integrate

on:
  push:
    branches:
      - agent/program-4-motorcycle-records
    paths:
      - .github/workflows/program-4c-integrate.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/program-4-motorcycle-records
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci --include=dev --silent

      - name: Integrate Program 4C UI and routes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              if old not in text:
                  raise SystemExit(f"Expected block not found: {label}")
              return text.replace(old, new, 1)

          index_path = Path("server/index.ts")
          text = index_path.read_text()
          text = replace_once(
              text,
              'import { registerMotorcycleAssemblyLifecycleRoutes } from "./routes/motorcycleAssemblyLifecycleRoutes";\n',
              'import { registerMotorcycleAssemblyLifecycleRoutes } from "./routes/motorcycleAssemblyLifecycleRoutes";\nimport { registerMotorcycleLifecycleOverviewRoutes } from "./routes/motorcycleLifecycleOverviewRoutes";\n',
              "index lifecycle overview import",
          )
          text = replace_once(
              text,
              '  registerMotorcycleWorkshopRoutes(app);\n  registerMotorcycleTimelineRoutes(app);\n',
              '  registerMotorcycleWorkshopRoutes(app);\n  registerMotorcycleTimelineRoutes(app);\n  registerMotorcycleLifecycleOverviewRoutes(app);\n',
              "index lifecycle overview registration",
          )
          index_path.write_text(text)

          page_path = Path("client/src/pages/Motorcycles.tsx")
          text = page_path.read_text()
          text = replace_once(
              text,
              'import { Bike, Link2, Pencil, Plus, RefreshCw, Search, Trash2 } from "lucide-react";',
              '''import {
            Activity,
            AlertTriangle,
            Bike,
            Factory,
            Link2,
            Pencil,
            Plus,
            RefreshCw,
            Search,
            Trash2,
          } from "lucide-react";''',
              "motorcycle icons",
          )
          text = replace_once(
              text,
              'import { MotorcycleSaleLinkDialog } from "@/components/MotorcycleSaleLinkDialog";\n',
              'import { AssemblyMotorcycleRegisterDialog } from "@/components/AssemblyMotorcycleRegisterDialog";\nimport { MotorcycleLifecycleDialog } from "@/components/MotorcycleLifecycleDialog";\nimport { MotorcycleSaleLinkDialog } from "@/components/MotorcycleSaleLinkDialog";\n',
              "motorcycle dialog imports",
          )
          text = replace_once(
              text,
              'interface CustomerOption {\n',
              '''interface LifecycleOverview {
            motorcycleId: number;
            serviceCount: number;
            warrantyCount: number;
            activeWarrantyCount: number;
            communicationCount: number;
            assemblyLinked: boolean;
            needsAttention: boolean;
          }

          interface CustomerOption {
          ''',
              "lifecycle overview interface",
          )
          text = replace_once(
              text,
              '''  const [saleLinkRecord, setSaleLinkRecord] = useState<MotorcycleRecord | null>(null);
            const [form, setForm] = useState<MotorcycleFormState>(blankForm);''',
              '''  const [saleLinkRecord, setSaleLinkRecord] = useState<MotorcycleRecord | null>(null);
            const [lifecycleRecord, setLifecycleRecord] = useState<MotorcycleRecord | null>(null);
            const [isAssemblyRegisterOpen, setIsAssemblyRegisterOpen] = useState(false);
            const [lifecycleFilter, setLifecycleFilter] = useState("all");
            const [form, setForm] = useState<MotorcycleFormState>(blankForm);''',
              "lifecycle state",
          )
          text = replace_once(
              text,
              '  const { data: customers = [] } = useQuery<CustomerOption[]>({\n',
              '''  const { data: lifecycleOverview = [] } = useQuery<LifecycleOverview[]>({
            queryKey: ["/api/motorcycle-lifecycle/overview", selectedCompany?.id],
            enabled: !!selectedCompany?.id,
          });

            const { data: customers = [] } = useQuery<CustomerOption[]>({
          ''',
              "lifecycle overview query",
          )
          text = replace_once(
              text,
              '''  const summary = useMemo(
            () => ({
              total: motorcycles.length,
              inStock: motorcycles.filter((record) => record.status === "IN_STOCK").length,
              reserved: motorcycles.filter((record) => record.status === "RESERVED").length,
              sold: motorcycles.filter((record) => record.status === "SOLD").length,
            }),
            [motorcycles],
          );''',
              '''  const lifecycleById = useMemo(
            () => new Map(lifecycleOverview.map((overview) => [overview.motorcycleId, overview])),
            [lifecycleOverview],
          );

            const visibleMotorcycles = useMemo(() => {
              if (lifecycleFilter === "all") return motorcycles;
              return motorcycles.filter((record) => {
                const overview = lifecycleById.get(record.id);
                if (!overview) return lifecycleFilter === "no-history";
                switch (lifecycleFilter) {
                  case "attention":
                    return overview.needsAttention;
                  case "service":
                    return overview.serviceCount > 0;
                  case "warranty":
                    return overview.activeWarrantyCount > 0;
                  case "assembly":
                    return overview.assemblyLinked;
                  case "no-history":
                    return (
                      overview.serviceCount === 0 &&
                      overview.warrantyCount === 0 &&
                      overview.communicationCount === 0 &&
                      !overview.assemblyLinked
                    );
                  default:
                    return true;
                }
              });
            }, [lifecycleById, lifecycleFilter, motorcycles]);

            const summary = useMemo(
              () => ({
                total: motorcycles.length,
                inStock: motorcycles.filter((record) => record.status === "IN_STOCK").length,
                reserved: motorcycles.filter((record) => record.status === "RESERVED").length,
                sold: motorcycles.filter((record) => record.status === "SOLD").length,
                attention: lifecycleOverview.filter((record) => record.needsAttention).length,
              }),
              [lifecycleOverview, motorcycles],
            );''',
              "lifecycle derived state",
          )
          text = replace_once(
              text,
              '''        <Button onClick={openCreate} className="gap-2" data-testid="button-add-motorcycle">
                  <Plus className="h-4 w-4" />
                  Add motorcycle
                </Button>''',
              '''        <div className="flex flex-wrap gap-2">
                  <Button
                    variant="outline"
                    onClick={() => setIsAssemblyRegisterOpen(true)}
                    className="gap-2"
                    data-testid="button-register-assembly-unit"
                  >
                    <Factory className="h-4 w-4" />
                    Register assembly unit
                  </Button>
                  <Button onClick={openCreate} className="gap-2" data-testid="button-add-motorcycle">
                    <Plus className="h-4 w-4" />
                    Add motorcycle
                  </Button>
                </div>''',
              "motorcycle header actions",
          )
          text = replace_once(
              text,
              '      <div className="grid gap-4 sm:grid-cols-2 xl:grid-cols-4">',
              '      <div className="grid gap-4 sm:grid-cols-2 xl:grid-cols-5">',
              "summary grid",
          )
          text = replace_once(
              text,
              '''        <Card>
                  <CardHeader className="pb-2">
                    <CardDescription>Sold</CardDescription>
                    <CardTitle className="text-3xl">{summary.sold}</CardTitle>
                  </CardHeader>
                </Card>
              </div>''',
              '''        <Card>
                  <CardHeader className="pb-2">
                    <CardDescription>Sold</CardDescription>
                    <CardTitle className="text-3xl">{summary.sold}</CardTitle>
                  </CardHeader>
                </Card>
                <Card className={summary.attention > 0 ? "border-destructive/50" : undefined}>
                  <CardHeader className="pb-2">
                    <CardDescription>Needs attention</CardDescription>
                    <CardTitle className="flex items-center gap-2 text-3xl">
                      {summary.attention}
                      {summary.attention > 0 && <AlertTriangle className="h-5 w-5 text-destructive" />}
                    </CardTitle>
                  </CardHeader>
                </Card>
              </div>''',
              "attention summary card",
          )
          text = replace_once(
              text,
              '        <CardContent className="grid gap-3 md:grid-cols-[minmax(0,1fr)_220px_220px_auto]">',
              '        <CardContent className="grid gap-3 xl:grid-cols-[minmax(0,1fr)_190px_190px_210px_auto]">',
              "filter grid",
          )
          text = replace_once(
              text,
              '''          <Button variant="outline" onClick={() => refetch()} className="gap-2">
                    <RefreshCw className="h-4 w-4" />
                    Refresh
                  </Button>''',
              '''          <select
                    className={selectClassName}
                    value={lifecycleFilter}
                    onChange={(event) => setLifecycleFilter(event.target.value)}
                    aria-label="Filter by lifecycle"
                    data-testid="select-motorcycle-lifecycle-filter"
                  >
                    <option value="all">All lifecycle records</option>
                    <option value="attention">Needs attention</option>
                    <option value="service">Has service history</option>
                    <option value="warranty">Active warranty</option>
                    <option value="assembly">Assembly linked</option>
                    <option value="no-history">No lifecycle history</option>
                  </select>
                  <Button
                    variant="outline"
                    onClick={() => {
                      refetch();
                      queryClient.invalidateQueries({ queryKey: ["/api/motorcycle-lifecycle/overview"] });
                    }}
                    className="gap-2"
                  >
                    <RefreshCw className="h-4 w-4" />
                    Refresh
                  </Button>''',
              "lifecycle filter",
          )
          text = text.replace(') : motorcycles.length === 0 ? (', ') : visibleMotorcycles.length === 0 ? (', 1)
          text = text.replace('{motorcycles.map((record) => (', '{visibleMotorcycles.map((record) => (', 1)
          text = replace_once(
              text,
              '                    <TableHead className="w-24 text-right">Actions</TableHead>',
              '                    <TableHead>Lifecycle</TableHead>\n                    <TableHead className="w-32 text-right">Actions</TableHead>',
              "lifecycle table header",
          )
          text = replace_once(
              text,
              '''                      <TableCell className="text-right tabular-nums">
                                {formatMoney(record.sellingPrice)}
                              </TableCell>
                              <TableCell>
                                <div className="flex justify-end gap-1">''',
              '''                      <TableCell className="text-right tabular-nums">
                                {formatMoney(record.sellingPrice)}
                              </TableCell>
                              <TableCell>
                                {(() => {
                                  const overview = lifecycleById.get(record.id);
                                  if (!overview) return <span className="text-xs text-muted-foreground">—</span>;
                                  return (
                                    <div className="space-y-1 text-xs">
                                      <div className="flex flex-wrap gap-1">
                                        {overview.serviceCount > 0 && <Badge variant="outline">{overview.serviceCount} service</Badge>}
                                        {overview.activeWarrantyCount > 0 && <Badge variant="outline">Warranty</Badge>}
                                        {overview.assemblyLinked && <Badge variant="outline">Assembly</Badge>}
                                        {overview.needsAttention && <Badge variant="destructive">Review</Badge>}
                                      </div>
                                      <span className="text-muted-foreground">
                                        {overview.communicationCount} communication{overview.communicationCount === 1 ? "" : "s"}
                                      </span>
                                    </div>
                                  );
                                })()}
                              </TableCell>
                              <TableCell>
                                <div className="flex justify-end gap-1">
                                  <Button
                                    variant="ghost"
                                    size="icon"
                                    onClick={() => setLifecycleRecord(record)}
                                    aria-label="Open motorcycle lifecycle"
                                    data-testid={`button-motorcycle-lifecycle-${record.id}`}
                                  >
                                    <Activity className="h-4 w-4" />
                                  </Button>''',
              "lifecycle row action",
          )
          text = replace_once(
              text,
              '''      <MotorcycleSaleLinkDialog
                motorcycle={saleLinkRecord}''',
              '''      <MotorcycleLifecycleDialog
                motorcycle={lifecycleRecord}
                open={Boolean(lifecycleRecord)}
                onOpenChange={(open) => {
                  if (!open) setLifecycleRecord(null);
                }}
              />

              <AssemblyMotorcycleRegisterDialog
                open={isAssemblyRegisterOpen}
                onOpenChange={setIsAssemblyRegisterOpen}
                onRegistered={() => {
                  refetch();
                  queryClient.invalidateQueries({ queryKey: ["/api/motorcycle-lifecycle/overview"] });
                }}
              />

              <MotorcycleSaleLinkDialog
                motorcycle={saleLinkRecord}''',
              "lifecycle dialogs",
          )
          page_path.write_text(text)

          package_path = Path("package.json")
          text = package_path.read_text()
          text = replace_once(
              text,
              'server/__tests__/motorcycleFinalizedSalePolicy.test.ts"',
              'server/__tests__/motorcycleFinalizedSalePolicy.test.ts server/__tests__/motorcycleLifecyclePolicy.test.ts"',
              "lifecycle test script",
          )
          package_path.write_text(text)

          docs_path = Path("docs/program-4-motorcycle-records-plan.md")
          text = docs_path.read_text()
          text = replace_once(
              text,
              '''## Phase 4C — Workshop and assembly lifecycle

          ### Planned scope

          - select registered motorcycles in service and warranty records
          - show a unified motorcycle timeline for sale, warranty, service, communication, and assembly events
          - connect completed assembly output to the individual motorcycle registry where applicable
          - add operational lifecycle filters and exception indicators

          ### Acceptance

          - Workshop users can locate a motorcycle by engine or chassis number.
          - Service and warranty history remains company- and customer-scoped.
          - Assembly and workshop linkage does not mutate accounting or stock outside existing approved flows.

          ## Definition of done for Phases 4A–4B

          Phases 4A–4B are complete only after the migration chain is idempotent, formatting and lint pass with zero warnings, package and whole-application TypeScript checks pass, CI-safe tests and production build pass, and all permanent PostgreSQL financial, payroll, stock, container, POS-value, report, and audit regressions remain green.''',
              '''## Phase 4C — Workshop and assembly lifecycle

          ### Completed scope

          - link service, warranty, and communication records to an individual registered motorcycle
          - keep the existing customer service center and historical free-text motorcycle records compatible
          - show a unified motorcycle timeline for registry, sale, warranty, service, communication, and assembly events
          - register completed Final Product assembly output as individual motorcycles without changing aggregate assembly inventory
          - cap individual registrations at the completed assembly quantity and prevent reopening linked completed output
          - add lifecycle summary counts, needs-attention indicators, and operational filters to the motorcycle registry
          - lock motorcycle removal after workshop or assembly history exists

          ### Acceptance

          - Workshop users can locate a motorcycle by engine or chassis number and open its complete lifecycle.
          - New service, warranty, and communication records remain company- and customer-scoped.
          - Completed assembly output can create only the number of individual units recorded as completed.
          - Assembly and workshop linkage does not create, reverse, or mutate accounting or stock movements.
          - Existing customer, workshop, warranty, communication, and assembly pages remain compatible.

          ## Definition of done for Phases 4A–4C

          Phases 4A–4C are complete only after the migration chain is idempotent, formatting and lint pass with zero warnings, package and whole-application TypeScript checks pass, CI-safe tests and production build pass, and all permanent PostgreSQL financial, payroll, stock, container, POS-value, report, and audit regressions remain green.''',
              "Phase 4C documentation",
          )
          docs_path.write_text(text)
          PY

      - name: Format permanent Program 4C files
        run: >-
          npx prettier --write
          client/src/components/AssemblyMotorcycleRegisterDialog.tsx
          client/src/components/MotorcycleLifecycleDialog.tsx
          client/src/pages/Motorcycles.tsx
          docs/program-4-motorcycle-records-plan.md
          migrations/0033_motorcycle_lifecycle_links.sql
          package.json
          server/__tests__/motorcycleLifecyclePolicy.test.ts
          server/index.ts
          server/routes/motorcycleAssemblyLifecycleRoutes.ts
          server/routes/motorcycleLifecycleOverviewRoutes.ts
          server/routes/motorcycleTimelineRoutes.ts
          server/routes/motorcycleWorkshopRoutes.ts
          server/services/motorcycles/lifecyclePolicy.ts
          server/services/motorcycles/lifecycleQueries.ts

      - name: Commit integration
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add client/src/components/AssemblyMotorcycleRegisterDialog.tsx client/src/components/MotorcycleLifecycleDialog.tsx client/src/pages/Motorcycles.tsx docs/program-4-motorcycle-records-plan.md migrations/0033_motorcycle_lifecycle_links.sql package.json server/__tests__/motorcycleLifecyclePolicy.test.ts server/index.ts server/routes/motorcycleAssemblyLifecycleRoutes.ts server/routes/motorcycleLifecycleOverviewRoutes.ts server/routes/motorcycleTimelineRoutes.ts server/routes/motorcycleWorkshopRoutes.ts server/services/motorcycles/lifecyclePolicy.ts server/services/motorcycles/lifecycleQueries.ts
          if git diff --cached --quiet; then
            echo "No integration changes required"
            exit 0
          fi
          git commit -m "Complete Program 4C lifecycle integration"
          git push origin HEAD:agent/program-4-motorcycle-records
