name: Program 2 Apply Route Guards

on:
  push:
    branches:
      - agent/program-2-financial-integrity-final

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out writable branch
        uses: actions/checkout@v4
        with:
          ref: agent/program-2-financial-integrity-final
          fetch-depth: 0

      - name: Apply focused route registration
        run: node scripts/apply-program2-route-guards.mjs

      - name: Commit route registration when changed
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Route guards already registered."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/routes.ts
          git commit -m "feat(accounting): register finalized mutation guards"
          git push origin HEAD:agent/program-2-financial-integrity-final
