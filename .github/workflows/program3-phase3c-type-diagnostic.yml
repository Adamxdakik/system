name: Program 3 Phase 3C Type Diagnostic

on:
  pull_request:

permissions:
  contents: read

jobs:
  diagnose:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --include=dev
      - name: Capture TypeScript baseline output
        shell: bash
        run: |
          set +e
          npm run check:all:baseline > docs/program3-phase3c-type-diagnostic.txt 2>&1
          status=$?
          echo "exit_status=$status" >> docs/program3-phase3c-type-diagnostic.txt
          exit 0
      - name: Commit diagnostic
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/program3-phase3c-type-diagnostic.txt
          git commit -m "chore(program-3): record phase 3C type diagnostic"
          git pull --rebase origin "${{ github.event.pull_request.head.ref }}"
          git push origin HEAD:"${{ github.event.pull_request.head.ref }}"
