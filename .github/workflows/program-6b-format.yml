name: Program 6B Format

on:
  pull_request:

permissions:
  contents: write

jobs:
  format:
    if: github.event.pull_request.head.ref == 'agent/program-6-frontend-operations'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out Program 6 branch
        uses: actions/checkout@v4
        with:
          ref: agent/program-6-frontend-operations
          fetch-depth: 0
          show-progress: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install exact dependencies
        run: npm ci --include=dev

      - name: Format Program 6B artifacts
        run: >-
          npx prettier --write
          docs/operations/environment-usage.json
          docs/operations/environment-variables.md
          docs/operations/release-runbook.md
          docs/operations/incident-response.md
          docs/operations/open-risk-register.md
          docs/program-6-frontend-operations-plan.md
          server/__tests__/typescriptConfig.test.ts

      - name: Commit formatting and remove temporary workflow
        shell: bash
        run: |
          git rm .github/workflows/program-6b-format.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/operations docs/program-6-frontend-operations-plan.md server/__tests__/typescriptConfig.test.ts
          git commit -m "Format Program 6B operational readiness artifacts"
          git push origin HEAD:agent/program-6-frontend-operations
