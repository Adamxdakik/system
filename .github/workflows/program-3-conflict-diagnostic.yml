name: Program 3 Conflict Diagnostic

on:
  pull_request:

permissions:
  contents: write

jobs:
  diagnose:
    if: github.event.pull_request.head.ref == 'agent/program-3-current-main-integration'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out current-main integration branch
        uses: actions/checkout@v4
        with:
          ref: agent/program-3-current-main-integration
          fetch-depth: 0
          show-progress: false

      - name: Persist exact Program 3 conflict files and blocks
        shell: bash
        run: |
          set +e
          git fetch origin agent/program-3-simplified-interface
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git merge --no-commit --no-ff origin/agent/program-3-simplified-interface
          merge_status=$?

          rm -rf docs/diagnostics/conflicted
          mkdir -p docs/diagnostics/conflicted
          git diff --name-only --diff-filter=U > docs/diagnostics/program3-conflict-files.txt
          git diff --cc > docs/diagnostics/program3-conflicts.diff
          cp client/src/components/StockItemCreateDialog.tsx docs/diagnostics/conflicted/StockItemCreateDialog.conflict.tsx
          cp client/src/components/StockItemEditDialog.tsx docs/diagnostics/conflicted/StockItemEditDialog.conflict.tsx
          cp client/src/pages/StockItems.tsx docs/diagnostics/conflicted/StockItems.conflict.tsx

          python3 - <<'PY'
          from pathlib import Path
          import json
          import re

          root = Path('docs/diagnostics/conflicted')
          report = {}
          pattern = re.compile(r'<<<<<<< HEAD\n(.*?)=======\n(.*?)>>>>>>> origin/agent/program-3-simplified-interface', re.S)
          for path in sorted(root.glob('*.tsx')):
              text = path.read_text(encoding='utf-8')
              blocks = []
              for index, match in enumerate(pattern.finditer(text), start=1):
                  blocks.append({
                      'index': index,
                      'ours': match.group(1).splitlines(),
                      'theirs': match.group(2).splitlines(),
                  })
              report[path.name] = blocks
          Path('docs/diagnostics/program3-conflict-blocks.json').write_text(
              json.dumps(report, indent=2) + '\n', encoding='utf-8'
          )
          PY

          git merge --abort || true
          git add docs/diagnostics
          git commit -m "Summarize temporary Program 3 conflict blocks"
          git push origin HEAD:agent/program-3-current-main-integration
          exit $(( merge_status == 0 ? 1 : 0 ))
