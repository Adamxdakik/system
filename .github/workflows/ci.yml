name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  typescript-diagnostic:
    if: github.event_name == 'pull_request' && github.head_ref == 'agent/program-3-simplified-interface-rebased'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install exact dependencies
        run: npm ci --include=dev
      - name: Capture normalized baseline output
        run: npm run check:all:baseline > typescript-baseline-diagnostic.txt 2>&1 || true
      - name: Capture raw TypeScript output
        run: npm run check:all > typescript-raw-diagnostic.txt 2>&1 || true
      - name: Upload TypeScript diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: program-3-typescript-diagnostic-final
          path: |
            typescript-baseline-diagnostic.txt
            typescript-raw-diagnostic.txt
          if-no-files-found: error
          retention-days: 1
