name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install exact dependencies
        run: npm ci --include=dev

      - name: Format Program 2 completion files in workspace
        run: >-
          npx prettier --write
          .github/workflows/ci.yml
          .github/workflows/program2-workspace.yml
          scripts/audit-supplier-company-assignments.ts
          server/services/accounting/voucherPostingService.ts
          server/__tests__/accountingIdempotencyRegression.test.ts
          package.json

      - name: Select changed-file comparison
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            echo "CHANGED_FILES_BASE=${{ github.event.pull_request.base.sha }}" >> "$GITHUB_ENV"
            echo "CHANGED_FILES_HEAD=${{ github.event.pull_request.head.sha }}" >> "$GITHUB_ENV"
          else
            echo "CHANGED_FILES_RANGE=${{ github.event.before }}..${{ github.sha }}" >> "$GITHUB_ENV"
          fi

      - name: Check formatting on changed lines
        run: npm run format:changed

      - name: Lint changed source lines with zero warnings
        run: npm run lint:changed

      - name: Check TypeScript packages
        run: npm run check

      - name: Enforce whole-application TypeScript baseline
        run: npm run check:all:baseline

      - name: Run CI-safe tests with diagnostics
        id: ci_tests
        continue-on-error: true
        shell: bash
        run: |
          set +e
          npm run test:ci > ci-tests.log 2>&1
          status=$?
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          tail -n 160 ci-tests.log
          exit 0

      - name: Upload test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: program2-test-diagnostics
          path: ci-tests.log
          retention-days: 1

      - name: Fail when CI-safe tests failed
        if: steps.ci_tests.outputs.exit_code != '0'
        run: exit 1

      - name: Build production bundles
        run: npm run build

      - name: Package exact source and Git tree metadata
        if: always()
        run: |
          git show -s --format=%T HEAD > tree-sha.txt
          git rev-parse HEAD > commit-sha.txt
          git archive --format=zip --output=source.zip HEAD
          zip -q -u source.zip \
            .github/workflows/ci.yml \
            .github/workflows/program2-workspace.yml \
            scripts/audit-supplier-company-assignments.ts \
            server/services/accounting/voucherPostingService.ts \
            server/__tests__/accountingIdempotencyRegression.test.ts \
            package.json

      - name: Upload workspace artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: program2-workspace
          path: |
            source.zip
            tree-sha.txt
            commit-sha.txt
          retention-days: 1

  accounting-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/program2_disposable_test

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: program2_disposable_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d program2_disposable_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install exact dependencies
        run: npm ci --include=dev

      - name: Run full migration chain with diagnostics
        id: migrate
        continue-on-error: true
        shell: bash
        run: |
          set +e
          npm run db:migrate > migration.log 2>&1
          status=$?
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          tail -n 200 migration.log
          exit 0

      - name: Upload migration diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: program2-migration-diagnostics
          path: migration.log
          retention-days: 1

      - name: Stop when migration failed
        if: steps.migrate.outputs.exit_code != '0'
        run: exit 1

      - name: Verify migration rerun is idempotent
        run: npm run db:migrate

      - name: Run PostgreSQL accounting integration tests with diagnostics
        id: postgres_tests
        continue-on-error: true
        shell: bash
        run: |
          set +e
          npm run test:accounting:integration -- --confirm-disposable > postgres-tests.log 2>&1
          status=$?
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          tail -n 240 postgres-tests.log
          exit 0

      - name: Upload PostgreSQL integration diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: program2-postgres-test-diagnostics
          path: postgres-tests.log
          retention-days: 1

      - name: Stop when PostgreSQL integration tests failed
        if: steps.postgres_tests.outputs.exit_code != '0'
        run: exit 1

      - name: Run accounting report reconciliation tests
        run: npm run test:accounting:reports

      - name: Run read-only financial audit
        run: npm run audit:financial -- --confirm-non-production --output json

      - name: Run read-only supplier company audit
        run: npm run audit:supplier-companies -- --confirm-non-production --output json
