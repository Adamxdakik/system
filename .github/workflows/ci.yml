name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  program-5b-cleanup:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'agent/program-5-bandwidth-verification'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out Program 5 branch
        uses: actions/checkout@v4
        with:
          ref: agent/program-5-bandwidth-verification
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install exact dependencies
        run: npm ci --include=dev

      - name: Remove dead query wave
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('server/routes/optimizedStockHistoryRoutes.ts')
          text = path.read_text(encoding='utf-8')

          interface_start = text.index('interface LocationMovementRow {')
          interface_end = text.index('\n}\n\n', interface_start) + 4
          text = text[:interface_start] + text[interface_end:]

          helper_start = text.index('function locationMovement(')
          helper_end = text.index('\n}\n\n', helper_start) + 4
          text = text[:helper_start] + text[helper_end:]

          query_start = text.index('  const [\n    priorTransferResult,')
          query_end_marker = '  const currentInventory = currentInventoryResult[0];'
          query_end = text.index(query_end_marker, query_start) + len(query_end_marker)
          replacement = '''  const currentInventoryResult = await db
            .select({
              quantity: inventory.quantity,
              averageRate: inventory.averageRate,
              totalValue: inventory.totalValue,
            })
            .from(inventory)
            .where(
              and(eq(inventory.locationId, locationId), eq(inventory.stockItemId, stockItemId)),
            )
            .limit(1);
  const currentInventory = currentInventoryResult[0];'''
          text = text[:query_start] + replacement + text[query_end:]

          text = text.replace(
              '    _reconciliation: { voucherOpeningQty, voucherOpeningValue },\n',
              '',
          )
          old_handler = '''        const result = (await coalesce(key, () =>
          loadLocationStockHistory(companyId, locationId, stockItemId, year, month),
        )) as any;
        delete result._reconciliation;
        return res.json(result);'''
          new_handler = '''        return res.json(
          await coalesce(key, () =>
            loadLocationStockHistory(companyId, locationId, stockItemId, year, month),
          ),
        );'''
          if old_handler not in text:
              raise SystemExit('location handler replacement target not found')
          text = text.replace(old_handler, new_handler)

          path.write_text(text, encoding='utf-8')
          PY

      - name: Format Program 5B files
        run: >-
          npx prettier --write
          docs/program-5b-static-audit.md
          package.json
          server/__tests__/heavyReadOptimization.test.ts
          server/index.ts
          server/routes/optimizedAccountsRoutes.ts
          server/routes/optimizedStockHistoryRoutes.ts
          server/services/performance/heavyReadCalculations.ts

      - name: Commit cleanup
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No cleanup changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/program-5b-static-audit.md package.json server/__tests__/heavyReadOptimization.test.ts server/index.ts server/routes/optimizedAccountsRoutes.ts server/routes/optimizedStockHistoryRoutes.ts server/services/performance/heavyReadCalculations.ts
          git commit -m "Clean and format Program 5B heavy reads"
          git push origin HEAD:agent/program-5-bandwidth-verification

  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install exact dependencies
        run: npm ci --include=dev

      - name: Select changed-file comparison
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            echo "CHANGED_FILES_BASE=${{ github.event.pull_request.base.sha }}" >> "$GITHUB_ENV"
            echo "CHANGED_FILES_HEAD=${{ github.event.pull_request.head.sha }}" >> "$GITHUB_ENV"
          else
            echo "CHANGED_FILES_RANGE=${{ github.event.before }}..${{ github.sha }}" >> "$GITHUB_ENV"
          fi

      - name: Check formatting on changed lines
        run: npm run format:changed

      - name: Lint changed source lines with zero warnings
        run: npm run lint:changed

      - name: Check TypeScript packages
        run: npm run check

      - name: Enforce whole-application TypeScript baseline
        run: npm run check:all:baseline

      - name: Run CI-safe tests
        run: npm run test:ci

      - name: Build production bundles
        run: npm run build

  accounting-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/program2_disposable_test

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: program2_disposable_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d program2_disposable_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install exact dependencies
        run: npm ci --include=dev

      - name: Run full migration chain
        run: npm run db:migrate

      - name: Verify migration rerun is idempotent
        run: npm run db:migrate

      - name: Run PostgreSQL accounting integration tests
        run: npm run test:accounting:integration -- --confirm-disposable

      - name: Run transactional payroll PostgreSQL regressions
        run: >-
          npx tsx --tsconfig tsconfig.integration-tests.json
          server/__tests__/payrollPosting.postgres.ts --confirm-disposable

      - name: Run exact stock movement PostgreSQL regressions
        run: >-
          npx tsx --tsconfig tsconfig.integration-tests.json
          server/__tests__/stockMovement.postgres.ts --confirm-disposable

      - name: Run exact container offload reversal PostgreSQL regressions
        run: >-
          npx tsx --tsconfig tsconfig.integration-tests.json
          server/__tests__/containerOffloadReversal.postgres.ts --confirm-disposable

      - name: Run POS inventory value regressions
        run: npx vitest run server/__tests__/posInventoryValue.test.ts

      - name: Run accounting report reconciliation tests
        run: npm run test:accounting:reports

      - name: Run read-only financial audit
        run: npm run audit:financial -- --confirm-non-production --output json

      - name: Run read-only supplier company audit
        run: npm run audit:supplier-companies -- --confirm-non-production --output json
