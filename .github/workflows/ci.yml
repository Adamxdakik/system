name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  program-4c-integrate:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'agent/program-4-motorcycle-records'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out Program 4 branch
        uses: actions/checkout@v4
        with:
          ref: agent/program-4-motorcycle-records
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install exact dependencies
        run: npm ci --include=dev

      - name: Run deterministic Program 4C patcher
        run: python scripts/program-4c-integrate.py

      - name: Format permanent Program 4C files
        run: >-
          npx prettier --write
          client/src/components/AssemblyMotorcycleRegisterDialog.tsx
          client/src/components/MotorcycleLifecycleDialog.tsx
          client/src/pages/Motorcycles.tsx
          docs/program-4-motorcycle-records-plan.md
          migrations/0033_motorcycle_lifecycle_links.sql
          package.json
          server/__tests__/motorcycleLifecyclePolicy.test.ts
          server/index.ts
          server/routes/motorcycleAssemblyLifecycleRoutes.ts
          server/routes/motorcycleLifecycleOverviewRoutes.ts
          server/routes/motorcycleTimelineRoutes.ts
          server/routes/motorcycleWorkshopRoutes.ts
          server/services/motorcycles/lifecyclePolicy.ts
          server/services/motorcycles/lifecycleQueries.ts

      - name: Commit integration
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add client/src/components/AssemblyMotorcycleRegisterDialog.tsx client/src/components/MotorcycleLifecycleDialog.tsx client/src/pages/Motorcycles.tsx docs/program-4-motorcycle-records-plan.md migrations/0033_motorcycle_lifecycle_links.sql package.json server/__tests__/motorcycleLifecyclePolicy.test.ts server/index.ts server/routes/motorcycleAssemblyLifecycleRoutes.ts server/routes/motorcycleLifecycleOverviewRoutes.ts server/routes/motorcycleTimelineRoutes.ts server/routes/motorcycleWorkshopRoutes.ts server/services/motorcycles/lifecyclePolicy.ts server/services/motorcycles/lifecycleQueries.ts
          if git diff --cached --quiet; then
            echo "No integration changes required"
            exit 0
          fi
          git commit -m "Complete Program 4C lifecycle integration"
          git push origin HEAD:agent/program-4-motorcycle-records

  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install exact dependencies
        run: npm ci --include=dev

      - name: Select changed-file comparison
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            echo "CHANGED_FILES_BASE=${{ github.event.pull_request.base.sha }}" >> "$GITHUB_ENV"
            echo "CHANGED_FILES_HEAD=${{ github.event.pull_request.head.sha }}" >> "$GITHUB_ENV"
          else
            echo "CHANGED_FILES_RANGE=${{ github.event.before }}..${{ github.sha }}" >> "$GITHUB_ENV"
          fi

      - name: Check formatting on changed lines
        run: npm run format:changed

      - name: Lint changed source lines with zero warnings
        run: npm run lint:changed

      - name: Check TypeScript packages
        run: npm run check

      - name: Enforce whole-application TypeScript baseline
        run: npm run check:all:baseline

      - name: Run CI-safe tests
        run: npm run test:ci

      - name: Build production bundles
        run: npm run build

  accounting-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/program2_disposable_test

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: program2_disposable_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d program2_disposable_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install exact dependencies
        run: npm ci --include=dev

      - name: Run full migration chain
        run: npm run db:migrate

      - name: Verify migration rerun is idempotent
        run: npm run db:migrate

      - name: Run PostgreSQL accounting integration tests
        run: npm run test:accounting:integration -- --confirm-disposable

      - name: Run transactional payroll PostgreSQL regressions
        run: >-
          npx tsx --tsconfig tsconfig.integration-tests.json
          server/__tests__/payrollPosting.postgres.ts --confirm-disposable

      - name: Run exact stock movement PostgreSQL regressions
        run: >-
          npx tsx --tsconfig tsconfig.integration-tests.json
          server/__tests__/stockMovement.postgres.ts --confirm-disposable

      - name: Run exact container offload reversal PostgreSQL regressions
        run: >-
          npx tsx --tsconfig tsconfig.integration-tests.json
          server/__tests__/containerOffloadReversal.postgres.ts --confirm-disposable

      - name: Run POS inventory value regressions
        run: npx vitest run server/__tests__/posInventoryValue.test.ts

      - name: Run accounting report reconciliation tests
        run: npm run test:accounting:reports

      - name: Run read-only financial audit
        run: npm run audit:financial -- --confirm-non-production --output json

      - name: Run read-only supplier company audit
        run: npm run audit:supplier-companies -- --confirm-non-production --output json
