name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  program-3-sync:
    if: github.event_name == 'pull_request' && github.head_ref == 'agent/program-3-simplified-interface-rebased' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out Program 3 branch
        uses: actions/checkout@v4
        with:
          ref: agent/program-3-simplified-interface-rebased
          fetch-depth: 0

      - name: Merge latest main and preserve the Program 3 container layout
        run: |
          git fetch origin main
          set +e
          git merge --no-commit --no-ff origin/main
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            conflicts="$(git diff --name-only --diff-filter=U)"
            if [ "$conflicts" != "client/src/pages/AddContainer.tsx" ]; then
              echo "Unexpected conflicts:"
              echo "$conflicts"
              exit 1
            fi
            git checkout --ours client/src/pages/AddContainer.tsx
            git add client/src/pages/AddContainer.tsx
          fi

          python <<'PY'
          from pathlib import Path

          path = Path("client/src/pages/AddContainer.tsx")
          text = path.read_text()
          start = '''                    {/* ── Qty / Rate / Total ── */}
                    <div className="grid grid-cols-3 gap-3">'''
          replacement = '''                    {/* ── Qty / Rate / Total ── */}
                    {/* Keep React Hook Form's registration refs while retaining keyboard focus refs. */}
                    {(() => {
                      const { ref: qtyRegRef, ...qtyRegRest } = form.register(
                        `items.${index}.quantity`,
                        { valueAsNumber: true },
                      );
                      const { ref: rateRegRef, ...rateRegRest } = form.register(
                        `items.${index}.ratePerKg`,
                        { valueAsNumber: true },
                      );
                      return (
                        <div className="grid grid-cols-3 gap-3">'''
          if start not in text:
              raise SystemExit("Quantity section anchor not found")
          text = text.replace(start, replacement, 1)
          text = text.replace(
              '{...form.register(`items.${index}.quantity`, { valueAsNumber: true })}',
              '{...qtyRegRest}',
              1,
          )
          text = text.replace(
              'ref={(el) => {\n                            qtyRefs.current[index] = el;',
              'ref={(el) => {\n                            qtyRegRef(el);\n                            qtyRefs.current[index] = el;',
              1,
          )
          text = text.replace(
              '{...form.register(`items.${index}.ratePerKg`, { valueAsNumber: true })}',
              '{...rateRegRest}',
              1,
          )
          text = text.replace(
              'ref={(el) => {\n                            rateRefs.current[index] = el;',
              'ref={(el) => {\n                            rateRegRef(el);\n                            rateRefs.current[index] = el;',
              1,
          )
          end = '''                    </div>
                  </div>
                );'''
          end_replacement = '''                        </div>
                      );
                    })()}
                  </div>
                );'''
          if end not in text:
              raise SystemExit("Quantity section closing anchor not found")
          text = text.replace(end, end_replacement, 1)
          path.write_text(text)
          PY

          rm -f .github/workflows/program-3-purchase-fix-once.yml
          rm -f .github/workflows/program-3-latest-main-once.yml
          git checkout origin/main -- .github/workflows/ci.yml

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci --include=dev
      - run: npx prettier --write client/src/pages/AddContainer.tsx client/src/pages/PurchaseOrderEdit.tsx

      - name: Commit synchronized Program 3 branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Sync latest main fixes into Program 3"
          git push origin HEAD:agent/program-3-simplified-interface-rebased

  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install exact dependencies
        run: npm ci --include=dev

      - name: Select changed-file comparison
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            echo "CHANGED_FILES_BASE=${{ github.event.pull_request.base.sha }}" >> "$GITHUB_ENV"
            echo "CHANGED_FILES_HEAD=${{ github.event.pull_request.head.sha }}" >> "$GITHUB_ENV"
          else
            echo "CHANGED_FILES_RANGE=${{ github.event.before }}..${{ github.sha }}" >> "$GITHUB_ENV"
          fi

      - name: Check formatting on changed lines
        run: npm run format:changed

      - name: Lint changed source lines with zero warnings
        run: npm run lint:changed

      - name: Check TypeScript packages
        run: npm run check

      - name: Enforce whole-application TypeScript baseline
        run: npm run check:all:baseline

      - name: Run CI-safe tests
        run: npm run test:ci

      - name: Build production bundles
        run: npm run build

  accounting-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/program2_disposable_test

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: program2_disposable_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d program2_disposable_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install exact dependencies
        run: npm ci --include=dev

      - name: Run full migration chain
        run: npm run db:migrate

      - name: Verify migration rerun is idempotent
        run: npm run db:migrate

      - name: Run PostgreSQL accounting integration tests
        run: npm run test:accounting:integration -- --confirm-disposable

      - name: Run transactional payroll PostgreSQL regressions
        run: >-
          npx tsx --tsconfig tsconfig.integration-tests.json
          server/__tests__/payrollPosting.postgres.ts --confirm-disposable

      - name: Run exact stock movement PostgreSQL regressions
        run: >-
          npx tsx --tsconfig tsconfig.integration-tests.json
          server/__tests__/stockMovement.postgres.ts --confirm-disposable

      - name: Run exact container offload reversal PostgreSQL regressions
        run: >-
          npx tsx --tsconfig tsconfig.integration-tests.json
          server/__tests__/containerOffloadReversal.postgres.ts --confirm-disposable

      - name: Run POS inventory value regressions
        run: npx vitest run server/__tests__/posInventoryValue.test.ts

      - name: Run accounting report reconciliation tests
        run: npm run test:accounting:reports

      - name: Run read-only financial audit
        run: npm run audit:financial -- --confirm-non-production --output json

      - name: Run read-only supplier company audit
        run: npm run audit:supplier-companies -- --confirm-non-production --output json
