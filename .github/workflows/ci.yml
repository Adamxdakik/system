name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  apply-payroll-test-format:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Check out writable PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install exact dependencies
        run: npm ci --include=dev

      - name: Format payroll PostgreSQL fixture
        run: npx prettier --write scripts/test-payroll-posting-postgres.ts

      - name: Commit formatted fixture
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Payroll PostgreSQL fixture is already formatted."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/test-payroll-posting-postgres.ts
          git commit -m "style(accounting): format payroll PostgreSQL fixture"
          git push origin HEAD:"${{ github.event.pull_request.head.ref }}"

  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install exact dependencies
        run: npm ci --include=dev

      - name: Select changed-file comparison
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            echo "CHANGED_FILES_BASE=${{ github.event.pull_request.base.sha }}" >> "$GITHUB_ENV"
            echo "CHANGED_FILES_HEAD=${{ github.event.pull_request.head.sha }}" >> "$GITHUB_ENV"
          else
            echo "CHANGED_FILES_RANGE=${{ github.event.before }}..${{ github.sha }}" >> "$GITHUB_ENV"
          fi

      - name: Check formatting on changed lines
        run: npm run format:changed

      - name: Lint changed source lines with zero warnings
        run: npm run lint:changed

      - name: Check TypeScript packages
        run: npm run check

      - name: Enforce whole-application TypeScript baseline
        run: npm run check:all:baseline

      - name: Run CI-safe tests
        run: npm run test:ci

      - name: Build production bundles
        run: npm run build

  accounting-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/program2_disposable_test

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: program2_disposable_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d program2_disposable_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install exact dependencies
        run: npm ci --include=dev

      - name: Run full migration chain
        run: npm run db:migrate

      - name: Verify migration rerun is idempotent
        run: npm run db:migrate

      - name: Run PostgreSQL accounting integration tests
        run: npm run test:accounting:integration -- --confirm-disposable

      - name: Run transactional payroll PostgreSQL regressions
        id: payroll_test
        continue-on-error: true
        shell: bash
        run: |
          set +e
          npx tsx scripts/test-payroll-posting-postgres.ts --confirm-disposable > payroll-postgres.log 2>&1
          status=$?
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          cat payroll-postgres.log
          exit 0

      - name: Upload payroll PostgreSQL diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: program2-payroll-postgres-diagnostics
          path: payroll-postgres.log
          retention-days: 1

      - name: Stop when payroll PostgreSQL regressions failed
        if: steps.payroll_test.outputs.exit_code != '0'
        run: exit 1

      - name: Run POS inventory value regressions
        run: npx vitest run server/__tests__/posInventoryValue.test.ts

      - name: Run accounting report reconciliation tests
        run: npm run test:accounting:reports

      - name: Run read-only financial audit
        run: npm run audit:financial -- --confirm-non-production --output json

      - name: Run read-only supplier company audit
        run: npm run audit:supplier-companies -- --confirm-non-production --output json
