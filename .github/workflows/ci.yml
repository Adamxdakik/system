name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - agent/program-2-financial-integrity-final

permissions:
  contents: read

jobs:
  apply-pos-inventory-fix:
    if: >-
      github.event_name == 'push' &&
      github.ref_name == 'agent/program-2-financial-integrity-final' &&
      github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Check out writable Program 2 branch
        uses: actions/checkout@v4
        with:
          ref: agent/program-2-financial-integrity-final
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install exact dependencies
        run: npm ci --include=dev

      - name: Apply exact POS inventory value fix
        run: node scripts/apply-pos-inventory-value-fix.mjs

      - name: Format Program 2 accounting files
        run: >-
          npx prettier --write
          server/services/accounting/posSaleCorrectionService.ts
          server/services/accounting/finalizedMutationPolicy.ts
          server/routes/finalizedFinancialMutationGuards.ts

      - name: Commit focused POS fix
        shell: bash
        run: |
          if git diff --quiet; then
            echo "POS inventory value fix is already applied."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            server/services/accounting/posSaleCorrectionService.ts \
            server/services/accounting/finalizedMutationPolicy.ts \
            server/routes/finalizedFinancialMutationGuards.ts
          git commit -m "fix(accounting): restore exact POS inventory value"
          git push origin HEAD:agent/program-2-financial-integrity-final

  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install exact dependencies
        run: npm ci --include=dev

      - name: Select changed-file comparison
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            echo "CHANGED_FILES_BASE=${{ github.event.pull_request.base.sha }}" >> "$GITHUB_ENV"
            echo "CHANGED_FILES_HEAD=${{ github.event.pull_request.head.sha }}" >> "$GITHUB_ENV"
          else
            echo "CHANGED_FILES_RANGE=${{ github.event.before }}..${{ github.sha }}" >> "$GITHUB_ENV"
          fi

      - name: Check formatting on changed lines
        run: npm run format:changed

      - name: Lint changed source lines with zero warnings
        run: npm run lint:changed

      - name: Check TypeScript packages
        run: npm run check

      - name: Enforce whole-application TypeScript baseline
        run: npm run check:all:baseline

      - name: Run CI-safe tests
        run: npm run test:ci

      - name: Build production bundles
        run: npm run build

  accounting-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/program2_disposable_test

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: program2_disposable_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d program2_disposable_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install exact dependencies
        run: npm ci --include=dev

      - name: Run full migration chain
        run: npm run db:migrate

      - name: Verify migration rerun is idempotent
        run: npm run db:migrate

      - name: Run PostgreSQL accounting integration tests
        run: npm run test:accounting:integration -- --confirm-disposable

      - name: Run accounting report reconciliation tests
        run: npm run test:accounting:reports

      - name: Run read-only financial audit
        run: npm run audit:financial -- --confirm-non-production --output json

      - name: Run read-only supplier company audit
        run: npm run audit:supplier-companies -- --confirm-non-production --output json
