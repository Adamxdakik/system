name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  phase3c-apply:
    if: >-
      github.event_name == 'pull_request' &&
      github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Check out PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install exact dependencies
        run: npm ci --include=dev

      - name: Extract and apply Phase 3C implementation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          workflow = Path(".github/workflows/program3-phase3c-implementation.yml").read_text()
          marker = "          python - <<'PY'\n"
          end_marker = "          PY\n\n          npx prettier"
          if marker not in workflow or end_marker not in workflow:
              raise RuntimeError("Could not locate the Phase 3C implementation block")
          block = workflow.split(marker, 1)[1].split(end_marker, 1)[0]
          lines = []
          for line in block.splitlines():
              lines.append(line[10:] if line.startswith("          ") else line)
          Path("/tmp/program3-phase3c-apply.py").write_text("\n".join(lines) + "\n")
          PY
          python /tmp/program3-phase3c-apply.py
          npx prettier --write \
            client/src/pages/POS.tsx \
            client/src/pages/PurchaseOrderEdit.tsx \
            client/src/pages/AddContainer.tsx

      - name: Restore permanent workflow and commit implementation
        shell: bash
        run: |
          git show origin/main:.github/workflows/ci.yml > .github/workflows/ci.yml
          rm .github/workflows/program3-phase3c-implementation.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            client/src/pages/POS.tsx \
            client/src/pages/PurchaseOrderEdit.tsx \
            client/src/pages/AddContainer.tsx \
            .github/workflows/ci.yml \
            .github/workflows/program3-phase3c-implementation.yml
          git commit -m "feat(program-3): simplify sale and purchase forms"
          git pull --rebase origin "${{ github.event.pull_request.head.ref }}"
          git push origin HEAD:"${{ github.event.pull_request.head.ref }}"

  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install exact dependencies
        run: npm ci --include=dev

      - name: Select changed-file comparison
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            echo "CHANGED_FILES_BASE=${{ github.event.pull_request.base.sha }}" >> "$GITHUB_ENV"
            echo "CHANGED_FILES_HEAD=${{ github.event.pull_request.head.sha }}" >> "$GITHUB_ENV"
          else
            echo "CHANGED_FILES_RANGE=${{ github.event.before }}..${{ github.sha }}" >> "$GITHUB_ENV"
          fi

      - name: Check formatting on changed lines
        run: npm run format:changed

      - name: Lint changed source lines with zero warnings
        run: npm run lint:changed

      - name: Check TypeScript packages
        run: npm run check

      - name: Enforce whole-application TypeScript baseline
        run: npm run check:all:baseline

      - name: Run CI-safe tests
        run: npm run test:ci

      - name: Build production bundles
        run: npm run build

  accounting-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/program2_disposable_test

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: program2_disposable_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d program2_disposable_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install exact dependencies
        run: npm ci --include=dev

      - name: Run full migration chain
        run: npm run db:migrate

      - name: Verify migration rerun is idempotent
        run: npm run db:migrate

      - name: Run PostgreSQL accounting integration tests
        run: npm run test:accounting:integration -- --confirm-disposable

      - name: Run transactional payroll PostgreSQL regressions
        run: >-
          npx tsx --tsconfig tsconfig.integration-tests.json
          server/__tests__/payrollPosting.postgres.ts --confirm-disposable

      - name: Run exact stock movement PostgreSQL regressions
        run: >-
          npx tsx --tsconfig tsconfig.integration-tests.json
          server/__tests__/stockMovement.postgres.ts --confirm-disposable

      - name: Run exact container offload reversal PostgreSQL regressions
        run: >-
          npx tsx --tsconfig tsconfig.integration-tests.json
          server/__tests__/containerOffloadReversal.postgres.ts --confirm-disposable

      - name: Run POS inventory value regressions
        run: npx vitest run server/__tests__/posInventoryValue.test.ts

      - name: Run accounting report reconciliation tests
        run: npm run test:accounting:reports

      - name: Run read-only financial audit
        run: npm run audit:financial -- --confirm-non-production --output json

      - name: Run read-only supplier company audit
        run: npm run audit:supplier-companies -- --confirm-non-production --output json
