name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  program-3-typescript-fix:
    if: github.event_name == 'pull_request' && github.head_ref == 'agent/program-3-simplified-interface-rebased' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out Program 3 branch
        uses: actions/checkout@v4
        with:
          ref: agent/program-3-simplified-interface-rebased
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci --include=dev

      - name: Repair exact TypeScript regressions
        run: |
          python <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file_path = Path(path)
              text = file_path.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"Expected one match in {path}, found {count}: {old[:80]!r}")
              file_path.write_text(text.replace(old, new, 1))

          replace_once(
              "client/src/pages/PurchaseOrderEdit.tsx",
              "invalidateAccountingQueries(queryClient, poId);",
              "invalidateAccountingQueries(queryClient, poId ?? undefined);",
          )

          replace_once(
              "server/index.ts",
              '''    if (source && !source.includes(host)) {
      return res.status(403).json({ message: "CSRF check failed: invalid origin" });
    }
  }
  next();
});''',
              '''    if (source && !source.includes(host)) {
      return res.status(403).json({ message: "CSRF check failed: invalid origin" });
    }
  }
  return next();
});''',
          )

          routes_path = Path("server/routes.ts")
          routes = routes_path.read_text()

          schema_anchor = '} from "@shared/schema";\n'
          schema_import = 'import * as schema from "@shared/schema";\n'
          if schema_import not in routes:
              if routes.count(schema_anchor) != 1:
                  raise SystemExit("Shared schema import anchor not found exactly once")
              routes = routes.replace(schema_anchor, schema_anchor + schema_import, 1)

          validate_anchor = '''      // Get all stock items for validation
      const allStockItems = await storage.getAllStockItems(req.session.currentCompanyId!);

      // Validate all items in the preview'''
          validate_replacement = '''      // Get all stock items and aliases for validation
      const allStockItems = await storage.getAllStockItems(req.session.currentCompanyId!);
      const aliasMap = await storage.getAllStockItemAliasMap(req.session.currentCompanyId!);

      // Validate all items in the preview'''
          if routes.count(validate_anchor) != 2:
              raise SystemExit(f"Expected two PO validation alias anchors, found {routes.count(validate_anchor)}")
          routes = routes.replace(validate_anchor, validate_replacement, 2)

          exact_replacements = [
              (
                  '''      res.json(companies);
    } catch (error: any) {
      res.status(500).json({ message: error.message });
    }
  });

  app.get("/api/user/companies"''',
                  '''      return res.json(companies);
    } catch (error: any) {
      return res.status(500).json({ message: error.message });
    }
  });

  app.get("/api/user/companies"''',
              ),
              (
                  '''      res.json({
        fileHash,
        fileName: req.file.originalname,
        rowCount: rows.length,
        preview,
      });
    } catch (error: any) {
      console.error("PO Import parse error:", error);
      res.status(500).json({ message: error.message });
    }
  });''',
                  '''      return res.json({
        fileHash,
        fileName: req.file.originalname,
        rowCount: rows.length,
        preview,
      });
    } catch (error: any) {
      console.error("PO Import parse error:", error);
      return res.status(500).json({ message: error.message });
    }
  });''',
              ),
              (
                  '''      res.json({
        valid: errors.length === 0,
        errors,
      });
    } catch (error: any) {
      console.error("PO Import validation error:", error);
      res.status(500).json({ message: error.message });
    }
  });''',
                  '''      return res.json({
        valid: errors.length === 0,
        errors,
      });
    } catch (error: any) {
      console.error("PO Import validation error:", error);
      return res.status(500).json({ message: error.message });
    }
  });''',
              ),
              (
                  '''      res.json({
        success: true,
        containerId: container.id,
        containerNumber: container.containerNumber,
        itemsCount: containerPreview.itemsCount,
        grandTotal: containerPreview.grandTotal,
      });
    } catch (error: any) {
      console.error("PO Import error:", error);
      res.status(500).json({ message: error.message });
    }
  });''',
                  '''      return res.json({
        success: true,
        containerId: container.id,
        containerNumber: container.containerNumber,
        itemsCount: containerPreview.itemsCount,
        grandTotal: containerPreview.grandTotal,
      });
    } catch (error: any) {
      console.error("PO Import error:", error);
      return res.status(500).json({ message: error.message });
    }
  });''',
              ),
          ]

          for old, new in exact_replacements:
              count = routes.count(old)
              if count != 1:
                  raise SystemExit(f"Expected one route response block, found {count}: {old[:80]!r}")
              routes = routes.replace(old, new, 1)

          routes_path.write_text(routes)
          PY

      - name: Restore permanent workflow and format fixes
        run: |
          git checkout origin/main -- .github/workflows/ci.yml
          npx prettier --write client/src/pages/PurchaseOrderEdit.tsx server/index.ts server/routes.ts

      - name: Commit repaired Program 3 branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Repair Program 3 TypeScript regressions"
          git push origin HEAD:agent/program-3-simplified-interface-rebased

  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install exact dependencies
        run: npm ci --include=dev
      - name: Select changed-file comparison
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            echo "CHANGED_FILES_BASE=${{ github.event.pull_request.base.sha }}" >> "$GITHUB_ENV"
            echo "CHANGED_FILES_HEAD=${{ github.event.pull_request.head.sha }}" >> "$GITHUB_ENV"
          else
            echo "CHANGED_FILES_RANGE=${{ github.event.before }}..${{ github.sha }}" >> "$GITHUB_ENV"
          fi
      - name: Check formatting on changed lines
        run: npm run format:changed
      - name: Lint changed source lines with zero warnings
        run: npm run lint:changed
      - name: Check TypeScript packages
        run: npm run check
      - name: Enforce whole-application TypeScript baseline
        run: npm run check:all:baseline
      - name: Run CI-safe tests
        run: npm run test:ci
      - name: Build production bundles
        run: npm run build

  accounting-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/program2_disposable_test
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: program2_disposable_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d program2_disposable_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install exact dependencies
        run: npm ci --include=dev
      - name: Run full migration chain
        run: npm run db:migrate
      - name: Verify migration rerun is idempotent
        run: npm run db:migrate
      - name: Run PostgreSQL accounting integration tests
        run: npm run test:accounting:integration -- --confirm-disposable
      - name: Run transactional payroll PostgreSQL regressions
        run: >-
          npx tsx --tsconfig tsconfig.integration-tests.json
          server/__tests__/payrollPosting.postgres.ts --confirm-disposable
      - name: Run exact stock movement PostgreSQL regressions
        run: >-
          npx tsx --tsconfig tsconfig.integration-tests.json
          server/__tests__/stockMovement.postgres.ts --confirm-disposable
      - name: Run exact container offload reversal PostgreSQL regressions
        run: >-
          npx tsx --tsconfig tsconfig.integration-tests.json
          server/__tests__/containerOffloadReversal.postgres.ts --confirm-disposable
      - name: Run POS inventory value regressions
        run: npx vitest run server/__tests__/posInventoryValue.test.ts
      - name: Run accounting report reconciliation tests
        run: npm run test:accounting:reports
      - name: Run read-only financial audit
        run: npm run audit:financial -- --confirm-non-production --output json
      - name: Run read-only supplier company audit
        run: npm run audit:supplier-companies -- --confirm-non-production --output json
