name: Program 4B final format

on:
  push:
    branches:
      - agent/program-4-motorcycle-records
    paths:
      - .github/workflows/program-4b-final-format.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/program-4-motorcycle-records
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci --include=dev --silent

      - name: Format permanent Program 4 files
        run: >-
          npx prettier --write
          client/src/App.tsx
          client/src/components/MotorcycleSaleLinkDialog.tsx
          client/src/config/navigation.ts
          client/src/pages/Motorcycles.tsx
          docs/program-4-motorcycle-records-plan.md
          migrations/0029_motorcycle_registry.sql
          migrations/0030_motorcycle_sale_links.sql
          migrations/0031_allow_multi_motorcycle_sales_voucher.sql
          migrations/0032_motorcycle_sale_customer_integrity.sql
          package.json
          server/__tests__/motorcycleFinalizedSalePolicy.test.ts
          server/httpSafety.ts
          server/index.ts
          server/routes/motorcycleRecordRoutes.ts
          server/routes/motorcycleSaleCustomerRoutes.ts
          server/routes/motorcycleSaleRoutes.ts
          server/services/motorcycles/finalizedSalePolicy.ts

      - name: Commit formatting
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No formatting changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add client/src/App.tsx client/src/components/MotorcycleSaleLinkDialog.tsx client/src/config/navigation.ts client/src/pages/Motorcycles.tsx docs/program-4-motorcycle-records-plan.md migrations/0029_motorcycle_registry.sql migrations/0030_motorcycle_sale_links.sql migrations/0031_allow_multi_motorcycle_sales_voucher.sql migrations/0032_motorcycle_sale_customer_integrity.sql package.json server/__tests__/motorcycleFinalizedSalePolicy.test.ts server/httpSafety.ts server/index.ts server/routes/motorcycleRecordRoutes.ts server/routes/motorcycleSaleCustomerRoutes.ts server/routes/motorcycleSaleRoutes.ts server/services/motorcycles/finalizedSalePolicy.ts
          git commit -m "Format final Program 4A-4B files"
          git push origin HEAD:agent/program-4-motorcycle-records
