name: Program 3 format once

on:
  push:
    branches:
      - agent/program-3-simplified-interface-rebased

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --include=dev
      - run: |
          npx prettier --write \
            client/src/components/AppSidebar.tsx \
            client/src/components/StockItemCreateDialog.tsx \
            client/src/components/StockItemEditDialog.tsx \
            client/src/config/navigation.ts \
            client/src/pages/AddContainer.tsx \
            client/src/pages/Dashboard.tsx \
            client/src/pages/POS.tsx \
            client/src/pages/PurchaseOrderEdit.tsx \
            client/src/pages/StockItems.tsx \
            docs/program-3-simplified-interface-plan.md
      - name: Commit formatting and remove workflow
        run: |
          rm .github/workflows/program-3-format-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Format rebased Program 3 files"
          git push origin HEAD:agent/program-3-simplified-interface-rebased
