name: Program 4B finalize

on:
  push:
    branches:
      - agent/program-4-motorcycle-records
    paths:
      - .github/workflows/program-4b-finalize.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/program-4-motorcycle-records
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci --include=dev --silent

      - name: Tighten sale policy and reversal handling
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          route = Path("server/routes/motorcycleSaleRoutes.ts")
          text = route.read_text()

          changes = [
              (
                  'import { asyncHandler } from "../lib/asyncHandler";\n',
                  'import { asyncHandler } from "../lib/asyncHandler";\n'
                  'import {\n'
                  '  isMotorcycleSaleEligible,\n'
                  '  linkedSaleCanBeReleased,\n'
                  '  motorcycleAndVoucherLocationsMatch,\n'
                  '  motorcyclePriceFitsVoucher,\n'
                  '  warrantyDatesAreValid,\n'
                  '} from "../services/motorcycles/finalizedSalePolicy";\n',
              ),
              (
                  '    if (\n'
                  '      value.warrantyStartDate &&\n'
                  '      value.warrantyEndDate &&\n'
                  '      value.warrantyEndDate < value.warrantyStartDate\n'
                  '    ) {\n',
                  '    if (!warrantyDatesAreValid(value.warrantyStartDate, value.warrantyEndDate)) {\n',
              ),
              (
                  '          if (!["IN_STOCK", "RESERVED"].includes(motorcycle.status)) {\n',
                  '          if (!isMotorcycleSaleEligible(motorcycle.status)) {\n',
              ),
              (
                  '          if (\n'
                  '            motorcycle.locationId &&\n'
                  '            voucher.locationId &&\n'
                  '            motorcycle.locationId !== voucher.locationId\n'
                  '          ) {\n',
                  '          if (\n'
                  '            !motorcycleAndVoucherLocationsMatch(\n'
                  '              motorcycle.locationId,\n'
                  '              voucher.locationId,\n'
                  '            )\n'
                  '          ) {\n',
              ),
              (
                  '          if (Number(input.sellingPrice) > Number(voucher.totalAmount)) {\n',
                  '          if (!motorcyclePriceFitsVoucher(input.sellingPrice, voucher.totalAmount)) {\n',
              ),
              (
                  '      await db\n'
                  '        .transaction(async (tx) => {\n',
                  '      try {\n'
                  '        await db.transaction(async (tx) => {\n',
              ),
              (
                  '          if (!linked.reversedAt) {\n',
                  '          if (!linkedSaleCanBeReleased(linked.reversedAt)) {\n',
              ),
              (
                  '        })\n'
                  '        .catch((error: any) => {\n'
                  '          if (error?.httpStatus) {\n'
                  '            throw error;\n'
                  '          }\n'
                  '          throw error;\n'
                  '        });\n\n'
                  '      const motorcycle = await getMotorcycleSaleRecord(companyId, motorcycleId);\n',
                  '        });\n'
                  '      } catch (error: any) {\n'
                  '        if (error?.httpStatus) {\n'
                  '          return res.status(error.httpStatus).json({ message: error.message });\n'
                  '        }\n'
                  '        throw error;\n'
                  '      }\n\n'
                  '      const motorcycle = await getMotorcycleSaleRecord(companyId, motorcycleId);\n',
              ),
          ]

          for old, new in changes:
              if old not in text:
                  raise SystemExit(f"Expected route block not found:\n{old}")
              text = text.replace(old, new, 1)

          route.write_text(text)

          package_path = Path("package.json")
          package = json.loads(package_path.read_text())
          test_script = package["scripts"]["test:unit"]
          test_file = "server/__tests__/motorcycleFinalizedSalePolicy.test.ts"
          if test_file not in test_script:
              package["scripts"]["test:unit"] = f"{test_script} {test_file}"
          package_path.write_text(json.dumps(package, indent=2) + "\n")

          page = Path("client/src/pages/Motorcycles.tsx")
          page_text = page.read_text()
          old_option = '<option key={option.value} value={option.value}>\n                        {option.label}\n                      </option>'
          new_option = '<option\n                        key={option.value}\n                        value={option.value}\n                        disabled={option.value === "SOLD" && form.status !== "SOLD"}\n                      >\n                        {option.label}\n                      </option>'
          if old_option not in page_text:
              raise SystemExit("Expected motorcycle status option block not found")
          page.write_text(page_text.replace(old_option, new_option, 1))

          doc = Path("docs/program-4-motorcycle-records-plan.md")
          doc_text = doc.read_text()
          old_phase = '''## Phase 4B — Sales and customer linkage

### Planned scope

- select an existing in-stock motorcycle during motorcycle sales
- change lifecycle status through an explicit sale workflow
- link the sold unit to its customer, invoice, date, price, and warranty
- prevent the same motorcycle from being sold twice
- preserve the existing POS and accounting transaction boundaries

### Acceptance

- Finalized motorcycle sales update the individual unit exactly once.
- Draft or failed sales do not change motorcycle ownership or status.
- Corrections and cancellations follow the finalized-document safeguards established in Program 2.
'''
          new_phase = '''## Phase 4B — Sales and customer linkage

### Completed scope

- link an in-stock or reserved motorcycle to an existing finalized Sales voucher
- infer the customer from credit-sale voucher entries or require an explicit customer for cash sales
- copy the finalized voucher number and date into the motorcycle sale record
- save the motorcycle-specific selling price and warranty dates
- lock customer, sale date, invoice, selling price, status, and deletion after linking
- enforce one active motorcycle per finalized Sales voucher
- require the linked Sales voucher to be formally reversed before an administrator can release the motorcycle
- preserve the existing POS, inventory, and accounting transaction boundaries without reposting any financial or stock movement

### Acceptance

- Finalized motorcycle sales update the individual unit exactly once.
- Draft, optional, deleted, reversed, and reversal vouchers cannot be linked.
- The same motorcycle or Sales voucher cannot be sold twice.
- Cross-company customers and mismatched locations are refused.
- Manual edits cannot invent or erase a finalized motorcycle sale.
- Corrections and cancellations follow the finalized-document safeguards established in Program 2.
'''
          if old_phase not in doc_text:
              raise SystemExit("Expected Phase 4B roadmap block not found")
          doc_text = doc_text.replace(old_phase, new_phase, 1)
          doc_text = doc_text.replace("## Definition of done for Phase 4A", "## Definition of done for Phases 4A–4B")
          doc_text = doc_text.replace(
              "Phase 4A is complete only after",
              "Phases 4A–4B are complete only after",
          )
          doc.write_text(doc_text)
          PY

          npx prettier --write \
            server/routes/motorcycleSaleRoutes.ts \
            server/services/motorcycles/finalizedSalePolicy.ts \
            server/__tests__/motorcycleFinalizedSalePolicy.test.ts \
            client/src/pages/Motorcycles.tsx \
            client/src/components/MotorcycleSaleLinkDialog.tsx \
            docs/program-4-motorcycle-records-plan.md \
            package.json

      - name: Commit finalized Phase 4B
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/routes/motorcycleSaleRoutes.ts server/services/motorcycles/finalizedSalePolicy.ts server/__tests__/motorcycleFinalizedSalePolicy.test.ts client/src/pages/Motorcycles.tsx client/src/components/MotorcycleSaleLinkDialog.tsx docs/program-4-motorcycle-records-plan.md package.json
          git commit -m "Program 4B finalize sale safeguards and tests"
          git push origin HEAD:agent/program-4-motorcycle-records
