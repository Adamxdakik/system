name: Program 3 Phase 3A Lint Fix

on:
  pull_request:

permissions:
  contents: read

jobs:
  fix:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --include=dev
      - name: Remove unused Phase 3A imports
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          navigation = Path("client/src/config/navigation.ts")
          source = navigation.read_text()
          source = source.replace("  Package,\n", "", 1)
          source = source.replace("  BadgeCheck,\n", "", 1)
          navigation.write_text(source)

          dashboard = Path("client/src/pages/Dashboard.tsx")
          source = dashboard.read_text()
          source = source.replace("  defs,\n", "", 1)
          source = source.replace("  linearGradient,\n", "", 1)
          source = source.replace("  stop,\n", "", 1)
          dashboard.write_text(source)
          PY
          npx prettier --write client/src/config/navigation.ts client/src/pages/Dashboard.tsx
      - name: Commit lint cleanup
        shell: bash
        run: |
          if git diff --quiet -- client/src/config/navigation.ts client/src/pages/Dashboard.tsx; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add client/src/config/navigation.ts client/src/pages/Dashboard.tsx
          git commit -m "fix(program-3): remove unused phase 3A imports"
          git pull --rebase origin "${{ github.event.pull_request.head.ref }}"
          git push origin HEAD:"${{ github.event.pull_request.head.ref }}"
