name: Program 4 TypeScript fix

on:
  push:
    branches:
      - agent/program-4-motorcycle-records
    paths:
      - .github/workflows/program-4-type-diagnostics.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Program 4 branch
        uses: actions/checkout@v4
        with:
          ref: agent/program-4-motorcycle-records
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install exact dependencies
        run: npm ci --include=dev --silent

      - name: Normalize route handler returns
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("server/routes/motorcycleRecordRoutes.ts")
          text = path.read_text()
          replacements = {
              "      res.json(result.rows);": "      return res.json(result.rows);",
              "        res.status(201).json(motorcycle);": "        return res.status(201).json(motorcycle);",
              "        res.json(motorcycle);": "        return res.json(motorcycle);",
              "      res.status(204).send();": "      return res.status(204).send();",
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f"Expected route text not found: {old}")
              text = text.replace(old, new, 1)
          path.write_text(text)
          PY
          npx prettier --write server/routes/motorcycleRecordRoutes.ts
          rm -f docs/program-4-type-errors.txt

      - name: Commit TypeScript fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/routes/motorcycleRecordRoutes.ts
          git add -u docs/program-4-type-errors.txt
          git commit -m "Fix Program 4A route return paths"
          git push origin HEAD:agent/program-4-motorcycle-records
