name: Program 4 TypeScript diagnostics

on:
  push:
    branches:
      - agent/program-4-motorcycle-records
    paths:
      - .github/workflows/program-4-type-diagnostics.yml

permissions:
  contents: write

jobs:
  diagnostics:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Program 4 branch
        uses: actions/checkout@v4
        with:
          ref: agent/program-4-motorcycle-records
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install exact dependencies
        run: npm ci --include=dev --silent

      - name: Capture whole-app TypeScript diagnostics
        shell: bash
        run: |
          npm run check:all:baseline > docs/program-4-type-errors.txt 2>&1 || true
          cat docs/program-4-type-errors.txt

      - name: Commit diagnostics
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/program-4-type-errors.txt
          git commit -m "Capture Program 4 TypeScript diagnostics"
          git push origin HEAD:agent/program-4-motorcycle-records
