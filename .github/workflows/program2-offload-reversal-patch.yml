name: Program 2 Offload Reversal Patch

on:
  pull_request:

permissions:
  contents: read

jobs:
  apply:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Check out writable PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Install exact dependencies
        run: npm ci --include=dev

      - name: Apply exact offload transaction patch
        run: |
          git apply --check scripts/program2-offload-reversal.patch
          git apply scripts/program2-offload-reversal.patch

      - name: Format focused TypeScript files
        run: |
          npx prettier --write \
            server/storage.ts \
            server/financialCorrectionRoutes.ts \
            server/routes/containerOffloadReversalRoutes.ts \
            server/services/accounting/containerOffloadEvidenceSchema.ts \
            server/services/accounting/containerOffloadReversalService.ts \
            server/__tests__/containerOffloadReversal.postgres.ts

      - name: Commit exact offload reversal implementation
        id: commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            server/storage.ts \
            server/financialCorrectionRoutes.ts \
            server/routes/containerOffloadReversalRoutes.ts \
            server/services/accounting/containerOffloadEvidenceSchema.ts \
            server/services/accounting/containerOffloadReversalService.ts \
            server/__tests__/containerOffloadReversal.postgres.ts \
            migrations/0025_container_offload_reversal_evidence.sql
          if git diff --cached --quiet; then
            echo "created=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git diff --cached --stat
          git commit -m "feat(accounting): make container offload reversal exact and immutable"
          echo "created=true" >> "$GITHUB_OUTPUT"

      - name: Push exact offload reversal implementation
        if: steps.commit.outputs.created == 'true'
        run: git push origin HEAD:"${{ github.event.pull_request.head.ref }}"
