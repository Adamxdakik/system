name: Program 2 Conflict Map

on:
  push:
    branches:
      - agent/program-2-financial-integrity-final

permissions:
  contents: write

jobs:
  map:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/program-2-financial-integrity-final
          fetch-depth: 0
      - name: Capture main-only route changes
        shell: bash
        run: |
          git fetch origin main
          BASE=$(git merge-base HEAD origin/main)
          git diff "$BASE" origin/main -- server/routes.ts > program2-main-routes.patch
          git diff --name-only "$BASE" origin/main > program2-main-files.txt
          cat program2-main-routes.patch
      - name: Commit conflict map
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add program2-main-routes.patch program2-main-files.txt
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: capture current main conflict map"
          git push origin HEAD:agent/program-2-financial-integrity-final
