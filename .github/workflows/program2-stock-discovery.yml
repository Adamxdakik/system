name: Program 2 Stock Discovery

on:
  pull_request:

permissions:
  contents: read

jobs:
  discover:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Map stock movement routes and callers
        shell: bash
        run: |
          {
            echo '=== ROUTES AND STORAGE ==='
            grep -RInE 'createStockTransfer|createStockAdjustment|/api/stock-transfers|/api/stock-adjustments|/api/vouchers/.*/transfer|/api/vouchers/.*/adjustment|stock-transfer-import' server shared client 2>/dev/null || true
            echo '=== FETCH/MUTATION CALLERS ==='
            grep -RInE 'stock-transfers|stock-adjustments|Stock Transfer|StockTransfer|Production|Consumption' client/src 2>/dev/null || true
          } > program2-stock-discovery.txt
          cat program2-stock-discovery.txt
      - name: Upload discovery
        uses: actions/upload-artifact@v4
        with:
          name: program2-stock-discovery
          path: program2-stock-discovery.txt
          retention-days: 1
