name: Program 2 Workspace

on:
  push:
    branches:
      - agent/program-2-financial-integrity-final

permissions:
  contents: read

jobs:
  package-workspace:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Package exact source and Git tree metadata
        run: |
          git show -s --format=%T HEAD > tree-sha.txt
          git rev-parse HEAD > commit-sha.txt
          git archive --format=zip --output=source.zip HEAD

      - name: Upload workspace artifact
        uses: actions/upload-artifact@v4
        with:
          name: program2-workspace
          path: |
            source.zip
            tree-sha.txt
            commit-sha.txt
          retention-days: 1
