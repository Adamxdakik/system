name: Program 2 Fix App Route

on:
  push:
    branches:
      - agent/program-2-financial-integrity-final

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/program-2-financial-integrity-final
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --include=dev
      - name: Fix SalesReport route typing
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('client/src/App.tsx')
          source = path.read_text()
          old = '<Route path="/sales-report" component={SalesReport} />'
          new = '<Route path="/sales-report">{() => <SalesReport />}</Route>'
          if old in source:
              source = source.replace(old, new, 1)
          elif new not in source:
              raise SystemExit('SalesReport route anchor not found')
          path.write_text(source)
          PY
          npx prettier --write client/src/App.tsx
      - name: Commit focused route fix
        shell: bash
        run: |
          if git diff --quiet -- client/src/App.tsx; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add client/src/App.tsx
          git commit -m "fix(ui): render SalesReport route with compatible props"
          git pull --rebase origin agent/program-2-financial-integrity-final
          git push origin HEAD:agent/program-2-financial-integrity-final
