name: Program 3 Phase 3C Cleanup Run

on:
  pull_request:

permissions:
  contents: read

jobs:
  cleanup:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --include=dev
      - name: Apply final Phase 3C cleanup
        run: |
          python scripts/program3-phase3c-cleanup.py
          npx prettier --write \
            client/src/pages/POS.tsx \
            client/src/pages/PurchaseOrderEdit.tsx \
            client/src/pages/AddContainer.tsx
          rm scripts/program3-phase3c-cleanup.py
          rm .github/workflows/program3-phase3c-cleanup-run.yml
      - name: Commit cleanup
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            client/src/pages/POS.tsx \
            client/src/pages/PurchaseOrderEdit.tsx \
            client/src/pages/AddContainer.tsx \
            scripts/program3-phase3c-cleanup.py \
            .github/workflows/program3-phase3c-cleanup-run.yml
          git commit -m "fix(program-3): finish phase 3C cleanup"
          git pull --rebase origin "${{ github.event.pull_request.head.ref }}"
          git push origin HEAD:"${{ github.event.pull_request.head.ref }}"
