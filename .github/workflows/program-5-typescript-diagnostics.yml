name: Program 5 TypeScript Diagnostics

on:
  pull_request:

permissions:
  contents: write

jobs:
  diagnose:
    if: github.event.pull_request.head.ref == 'agent/program-5-bandwidth-verification'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out Program 5 branch
        uses: actions/checkout@v4
        with:
          ref: agent/program-5-bandwidth-verification
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install exact dependencies
        run: npm ci --include=dev

      - name: Capture whole-application TypeScript diagnostics
        shell: bash
        run: |
          set +e
          npm run check:all:baseline > docs/program-5-typescript-diagnostics.txt 2>&1
          status=$?
          set -e
          echo "exit_status=$status" >> docs/program-5-typescript-diagnostics.txt

      - name: Commit diagnostics and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/program-5-typescript-diagnostics.yml
          git add docs/program-5-typescript-diagnostics.txt
          git commit -m "Capture Program 5 TypeScript diagnostics"
          git push origin HEAD:agent/program-5-bandwidth-verification
