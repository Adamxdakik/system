name: Program 2 PR Apply Patch

on:
  pull_request:
    branches:
      - agent/program-2-ci-base
    paths:
      - .program2/apply.ready

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'agent/program-2-financial-integrity-final'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out Program 2 branch
        uses: actions/checkout@v4
        with:
          ref: agent/program-2-financial-integrity-final
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install exact dependencies
        run: npm ci --include=dev

      - name: Apply deterministic Program 2 patches
        run: python .program2/apply.py

      - name: Format scoped Program 2 source
        run: >-
          npx prettier --write
          shared/schema.ts
          server/financialCorrectionRoutes.ts
          server/services/accounting/drizzleAccountingStore.ts
          server/services/accounting/finalizedVoucherCorrectionService.ts
          server/services/accounting/openingBalanceImportService.ts
          server/services/accounting/posSaleCorrectionService.ts
          server/services/accounting/salaryAdvanceService.ts
          server/services/accounting/voucherPostingService.ts
          server/__tests__/accountingIdempotencyRegression.test.ts
          server/__tests__/finalizedVoucherCorrection.test.ts
          scripts/audit-supplier-company-assignments.ts
          package.json

      - name: Remove one-time marker
        run: rm -f .program2/apply.ready

      - name: Commit patched files
        shell: bash
        run: |
          git config user.name "program2-integrity-bot"
          git config user.email "program2-integrity-bot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No patch changes were required"
            exit 0
          fi
          git commit -m "Apply Program 2 route and test corrections"
          git push origin HEAD:agent/program-2-financial-integrity-final
