name: Temporary Format Diagnostic

on:
  pull_request:

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Format changed files
        run: >-
          npx prettier --write
          client/src/lib/queryClient.ts
          package.json
          server/routes/effectiveFinancialReadRoutes.ts
          server/routes/finalizedFinancialMutationGuards.ts
          server/services/accounting/effectiveVoucherView.ts
          server/__tests__/effectiveVoucherView.test.ts
      - name: Upload formatted files
        uses: actions/upload-artifact@v4
        with:
          name: formatted-files
          path: |
            client/src/lib/queryClient.ts
            package.json
            server/routes/effectiveFinancialReadRoutes.ts
            server/routes/finalizedFinancialMutationGuards.ts
            server/services/accounting/effectiveVoucherView.ts
            server/__tests__/effectiveVoucherView.test.ts
