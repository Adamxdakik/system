name: Program 3 Phase 3A Apply

on:
  pull_request:

permissions:
  contents: read

jobs:
  apply:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Check out writable PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Install exact dependencies
        run: npm ci --include=dev

      - name: Apply Phase 3A simplification
        run: python scripts/apply-program3-phase3a.py

      - name: Format focused files
        run: |
          npx prettier --write \
            client/src/config/navigation.ts \
            client/src/components/AppSidebar.tsx \
            client/src/pages/Dashboard.tsx

      - name: Commit Phase 3A
        shell: bash
        run: |
          if git diff --quiet -- \
            client/src/config/navigation.ts \
            client/src/components/AppSidebar.tsx \
            client/src/pages/Dashboard.tsx; then
            echo "Phase 3A is already applied."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            client/src/config/navigation.ts \
            client/src/components/AppSidebar.tsx \
            client/src/pages/Dashboard.tsx
          git commit -m "feat(program-3): simplify navigation and dashboard hierarchy"
          git pull --rebase origin "${{ github.event.pull_request.head.ref }}"
          git push origin HEAD:"${{ github.event.pull_request.head.ref }}"
