name: Program 2 Offload Diagnostics

on:
  pull_request:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/program2_disposable_test
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: program2_disposable_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d program2_disposable_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --include=dev
      - run: npm run db:migrate
      - name: Capture offload regression
        shell: bash
        run: |
          set +e
          npx tsx --tsconfig tsconfig.integration-tests.json \
            server/__tests__/containerOffloadReversal.postgres.ts \
            --confirm-disposable > offload-regression.log 2>&1
          echo $? > offload-regression.exit
          set -e
          cat offload-regression.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: program2-offload-regression
          path: |
            offload-regression.log
            offload-regression.exit
          retention-days: 1
