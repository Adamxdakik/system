name: Phase 1 TypeScript Diagnostic

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  diagnose-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 3cadbe2af235996af64f965dd178b7008700e158
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install baseline dependencies quietly
        run: npm ci --include=dev >/dev/null
      - name: Capture last-green raw TypeScript diagnostics
        id: baseline
        shell: bash
        run: |
          set +e
          npm run check:all > phase-1-typescript-baseline.log 2>&1
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload baseline diagnostic log
        uses: actions/upload-artifact@v4
        with:
          name: phase-1-typescript-baseline-log
          path: phase-1-typescript-baseline.log
          if-no-files-found: error
          retention-days: 1
      - name: Preserve baseline command status
        if: steps.baseline.outputs.status != '0'
        run: exit 1
