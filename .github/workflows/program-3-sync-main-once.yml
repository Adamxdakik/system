name: Program 3 sync main once

on:
  push:
    branches:
      - agent/program-3-simplified-interface-rebased

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Merge current main and preserve Program 3 purchase-order layout
        run: |
          git fetch origin main
          set +e
          git merge --no-commit --no-ff origin/main
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            conflicts="$(git diff --name-only --diff-filter=U)"
            if [ "$conflicts" != "client/src/pages/PurchaseOrderEdit.tsx" ]; then
              echo "Unexpected conflicts:"
              echo "$conflicts"
              exit 1
            fi
            git checkout --ours client/src/pages/PurchaseOrderEdit.tsx
            git add client/src/pages/PurchaseOrderEdit.tsx
          fi

          python <<'PY'
          from pathlib import Path

          path = Path("client/src/pages/PurchaseOrderEdit.tsx")
          text = path.read_text()
          old = 'queryClient.invalidateQueries({ queryKey: [`/api/containers/${containerId ?? ""}`] });'
          new = 'queryClient.invalidateQueries({ queryKey: [`/api/containers/${po?.containerId ?? ""}`] });'
          if old not in text:
              raise SystemExit("Expected container invalidation line not found")
          path.write_text(text.replace(old, new, 1))
          PY

          rm docs/program-3-ts-diagnostic.txt

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci --include=dev
      - run: npx prettier --write client/src/pages/PurchaseOrderEdit.tsx

      - name: Commit synchronized Program 3 branch
        run: |
          rm .github/workflows/program-3-sync-main-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Sync Program 3 with current main"
          git push origin HEAD:agent/program-3-simplified-interface-rebased
