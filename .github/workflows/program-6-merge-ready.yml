name: Program 6 Merge Ready

on:
  pull_request:

permissions:
  contents: write
  pull-requests: write

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'agent/program-6-merge-ready'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out current main branch
        uses: actions/checkout@v4
        with:
          ref: agent/program-6-merge-ready
          fetch-depth: 0
          show-progress: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install exact dependencies
        run: npm ci --include=dev

      - name: Apply exact Program 6 delta
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ ! -f .github/workflows/program-6-merge-ready.yml ]]; then
            echo 'Program 6 delta already applied.'
            exit 0
          fi

          set +e
          (
            set -e
            git fetch origin agent/program-5-bandwidth-verification agent/program-6-frontend-quality
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

            files=(
              .env.example
              client/src/App.tsx
              client/src/components/ErrorBoundary.tsx
              client/src/components/OfflineBanner.tsx
              client/src/components/PageLoader.tsx
              client/src/components/ui/button.tsx
              client/src/components/ui/form.tsx
              client/src/components/ui/input.tsx
              client/src/components/ui/textarea.tsx
              client/src/hooks/useHeartbeat.ts
              client/src/lib/frontendResilience.ts
              docs/operations/README.md
              docs/operations/environment-usage.json
              docs/operations/environment-variables.md
              docs/program-6-frontend-quality-plan.md
              docs/program-6-operations-readiness.md
              docs/program-6b-accessibility-audit.md
              package.json
              server/__tests__/frontendBuildSafety.test.ts
              server/__tests__/frontendInteractionSafety.test.ts
              server/__tests__/frontendResilience.test.ts
              server/__tests__/operationsDocumentation.test.ts
              tsconfig.tests.json
              vite.config.ts
            )

            git diff --binary \
              5c36d72e2c57c52d3eff95361aad1824190660cd \
              9ff5edb9a8f976a8f6926b71fba79d80d5c9bcd9 \
              -- "${files[@]}" > /tmp/program6.patch

            git apply --3way --index /tmp/program6.patch
            git rm .github/workflows/program-6-merge-ready.yml

            npm run check:all:baseline

            actual=$(git diff --cached --name-only | sort)
            expected=$(printf '%s\n' "${files[@]}" | sort)
            expected=$(printf '%s\n%s\n' "$expected" '.github/workflows/program-6-merge-ready.yml' | sort)
            if [[ "$actual" != "$expected" ]]; then
              echo 'Unexpected Program 6 changed-file set'
              echo 'Expected:'
              echo "$expected"
              echo 'Actual:'
              echo "$actual"
              exit 1
            fi

            git commit -m "Program 6: add frontend resilience and operational readiness"
            git push origin HEAD:agent/program-6-merge-ready
          ) > /tmp/program6-apply.log 2>&1
          status=$?

          if [[ $status -ne 0 ]]; then
            {
              echo '### Program 6 merge-ready error'
              echo
              echo '```text'
              tail -n 200 /tmp/program6-apply.log
              echo '```'
            } > /tmp/program6-comment.md
            gh pr comment "${{ github.event.pull_request.number }}" \
              --repo Adamxdakik/system \
              --body-file /tmp/program6-comment.md
            exit 1
          fi

          cat /tmp/program6-apply.log
