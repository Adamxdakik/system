name: Program 6B Environment Audit

on:
  pull_request:

permissions:
  contents: write

jobs:
  audit:
    if: github.event.pull_request.head.ref == 'agent/program-6-frontend-operations'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out Program 6 branch
        uses: actions/checkout@v4
        with:
          ref: agent/program-6-frontend-operations
          fetch-depth: 0
          show-progress: false

      - name: Write referenced environment-variable audit
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          import re

          roots = [Path("server"), Path("client"), Path("scripts"), Path("shared"), Path("lib")]
          suffixes = {".ts", ".tsx", ".js", ".mjs", ".cjs"}
          patterns = [
              re.compile(r"process\.env\.([A-Z][A-Z0-9_]*)"),
              re.compile(r"process\.env\[['\"]([A-Z][A-Z0-9_]*)['\"]\]"),
              re.compile(r"import\.meta\.env\.([A-Z][A-Z0-9_]*)"),
          ]
          found = {}

          for root in roots:
              if not root.exists():
                  continue
              for path in root.rglob("*"):
                  if not path.is_file() or path.suffix not in suffixes:
                      continue
                  text = path.read_text(encoding="utf-8", errors="ignore")
                  for pattern in patterns:
                      for match in pattern.finditer(text):
                          found.setdefault(match.group(1), set()).add(str(path))

          output = {
              "generatedBy": "Program 6B static environment usage audit",
              "variables": [
                  {"name": name, "files": sorted(found[name])}
                  for name in sorted(found)
              ],
          }
          target = Path("docs/operations/environment-usage.json")
          target.parent.mkdir(parents=True, exist_ok=True)
          target.write_text(json.dumps(output, indent=2) + "\n", encoding="utf-8")
          PY

      - name: Commit audit and remove temporary workflow
        shell: bash
        run: |
          git rm .github/workflows/program-6b-environment-audit.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/operations/environment-usage.json
          git commit -m "Add Program 6B environment usage audit"
          git push origin HEAD:agent/program-6-frontend-operations
