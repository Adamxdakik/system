name: Program 2 Harden Offload Concurrency

on:
  pull_request:

permissions:
  contents: read

jobs:
  harden:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --include=dev
      - name: Add container row lock and concurrency regression
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          storage = Path('server/storage.ts')
          source = storage.read_text()
          anchor = '''    return await db.transaction(async (tx) => {
      const inventoryEvidence: Array<{'''
          replacement = '''    return await db.transaction(async (tx) => {
      const [lockedContainer] = await tx
        .select({
          id: schema.containers.id,
          companyId: schema.containers.companyId,
          status: schema.containers.status,
        })
        .from(schema.containers)
        .where(eq(schema.containers.id, containerId))
        .for("update")
        .limit(1);
      if (!lockedContainer || lockedContainer.companyId !== container.companyId) {
        throw new Error(`Container ${containerId} not found`);
      }
      if (lockedContainer.status === "OFFLOADED") {
        throw new Error("Container is already offloaded");
      }

      const inventoryEvidence: Array<{'''
          if replacement not in source:
              if anchor not in source:
                  raise SystemExit('Offload transaction anchor not found')
              source = source.replace(anchor, replacement, 1)
          storage.write_text(source)

          test = Path('server/__tests__/containerOffloadReversal.postgres.ts')
          source = test.read_text()
          if 'async function concurrentOffloadScenario()' not in source:
              marker = '''await exactReversalScenario();
await changedInventoryScenario();
await legacyScenario();'''
              block = '''async function concurrentOffloadScenario() {
  const data = await fixture("CONCURRENT");
  const args = [
    data.container.id,
    data.location.id,
    "10.00",
    data.dutyAgent.id,
    "0",
    null,
    [],
    "2026-07-16",
    [],
  ] as const;

  const results = await Promise.allSettled([
    storage.offloadContainer(...args),
    storage.offloadContainer(...args),
  ]);
  const fulfilled = results.filter((result) => result.status === "fulfilled");
  const rejected = results.filter((result) => result.status === "rejected");
  assert(fulfilled.length === 1, "exactly one concurrent offload must commit");
  assert(rejected.length === 1, "the duplicate concurrent offload must fail closed");

  const rows = await db
    .select()
    .from(containerOffloads)
    .where(eq(containerOffloads.containerId, data.container.id));
  assert(rows.length === 1, "concurrent requests must create one offload row");

  const [stock] = await db
    .select()
    .from(inventory)
    .where(
      and(
        eq(inventory.companyId, data.company.id),
        eq(inventory.locationId, data.location.id),
        eq(inventory.stockItemId, data.item.id),
      ),
    );
  assert(stock.quantity === "10.000", "concurrent requests must not double inventory");
}

await exactReversalScenario();
await changedInventoryScenario();
await legacyScenario();
await concurrentOffloadScenario();'''
              if marker not in source:
                  raise SystemExit('Offload test footer anchor not found')
              source = source.replace(marker, block, 1)
          test.write_text(source)
          PY
          npx prettier --write server/storage.ts server/__tests__/containerOffloadReversal.postgres.ts
      - name: Commit concurrency hardening
        shell: bash
        run: |
          if git diff --quiet -- server/storage.ts server/__tests__/containerOffloadReversal.postgres.ts; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/storage.ts server/__tests__/containerOffloadReversal.postgres.ts
          git commit -m "fix(accounting): serialize concurrent container offloads"
          git pull --rebase origin "${{ github.event.pull_request.head.ref }}"
          git push origin HEAD:"${{ github.event.pull_request.head.ref }}"
