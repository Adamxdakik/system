name: Program 3 reconcile once

on:
  push:
    branches:
      - agent/program-3-simplified-interface-rebased

permissions:
  contents: write

jobs:
  reconcile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Merge current main
        run: |
          git fetch origin main
          git merge --no-commit --no-ff origin/main || true
          conflicts="$(git diff --name-only --diff-filter=U)"
          if [ -n "$conflicts" ]; then
            if [ "$conflicts" != "client/src/pages/PurchaseOrderEdit.tsx" ]; then
              echo "Unexpected conflicts: $conflicts"
              exit 1
            fi
            git checkout --ours client/src/pages/PurchaseOrderEdit.tsx
            git add client/src/pages/PurchaseOrderEdit.tsx
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci --include=dev
      - run: python scripts/reconcile-program-3-once.py
      - run: npx prettier --write client/src/pages/POS.tsx client/src/pages/StockItems.tsx client/src/pages/PurchaseOrderEdit.tsx

      - name: Commit reconciled branch
        run: |
          rm .github/workflows/program-3-rebase-once.yml
          rm scripts/reconcile-program-3-once.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Reconcile Program 3 with current main"
          git push origin HEAD:agent/program-3-simplified-interface-rebased
